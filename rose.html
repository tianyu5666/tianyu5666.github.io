<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>韩玉 · 为你绽放 🌹</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%F0%9F%8C%B9%3C/text%3E%3C/svg%3E">
<style>
/* ============================================================
   🌹 粒子情书 v2 · 高清版
   · 逐像素点阵渲染（不再用模糊光晕贴图）→ 名字与玫瑰清晰锐利
   · 画布按设备像素（最高 3×）→ 1080p 原生清晰，4K 屏自动更高
   · 转场改为缓动 + 错峰 + 就近配对 → 顺滑不乱穿
   ============================================================ */
*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%;overflow:hidden;background:#07060c}
body{
  font-family:"PingFang SC","Microsoft YaHei","Hiragino Sans GB",sans-serif;
  color:#ffe9f0;-webkit-font-smoothing:antialiased;cursor:crosshair;
}
#stage{position:fixed;inset:0;display:block}

.back{
  position:fixed;left:16px;top:14px;z-index:5;font-size:13px;color:rgba(255,214,228,.72);
  text-decoration:none;padding:7px 14px;border-radius:999px;
  background:rgba(255,255,255,.06);border:1px solid rgba(255,180,205,.22);
  backdrop-filter:blur(6px);transition:all .25s ease;
}
.back:hover{color:#fff;background:rgba(255,120,160,.2);border-color:rgba(255,140,180,.5)}

.caption{
  position:fixed;left:50%;bottom:8%;transform:translate(-50%,16px);
  text-align:center;z-index:5;pointer-events:none;
  opacity:0;transition:opacity 1.6s ease,transform 1.6s ease;
}
.caption.show{opacity:1;transform:translate(-50%,0)}
.caption .line{
  font-family:"Kaiti SC","STKaiti","KaiTi","楷体",serif;
  font-size:clamp(16px,3.4vw,24px);letter-spacing:.22em;padding-left:.22em;
  color:#ffd9e6;text-shadow:0 0 18px rgba(255,80,130,.7),0 0 40px rgba(255,40,90,.4);
}
.caption .sign{
  margin-top:12px;font-family:"Kaiti SC","STKaiti","KaiTi","楷体",serif;
  font-size:clamp(12px,2.4vw,15px);letter-spacing:.3em;padding-left:.3em;
  color:rgba(255,190,210,.72);
}

.hint{
  position:fixed;left:50%;bottom:16px;transform:translateX(-50%);z-index:5;
  font-size:12px;color:rgba(255,205,222,.5);letter-spacing:.14em;
  opacity:0;transition:opacity 1.2s ease;pointer-events:none;white-space:nowrap;
}
.hint.show{opacity:1}

/* 在一起的第 N 天（与那封信同步） */
.caption .days{
  margin-top:10px;font-size:clamp(11.5px,2.2vw,14px);letter-spacing:.28em;padding-left:.28em;
  color:rgba(255,205,225,.7);
}
/* 许愿情话 */
.love{
  position:fixed;left:50%;bottom:19%;transform:translate(-50%,10px);z-index:6;
  font-family:"Kaiti SC","STKaiti","KaiTi","楷体",serif;
  font-size:clamp(15px,3.2vw,22px);letter-spacing:.2em;padding-left:.2em;
  color:#fff0f6;text-shadow:0 0 20px rgba(255,90,140,.85),0 0 46px rgba(255,50,100,.5);
  opacity:0;transition:opacity 1.2s ease,transform 1.2s ease;pointer-events:none;white-space:nowrap;
}
.love.show{opacity:1;transform:translate(-50%,0)}

.toletter{
  position:fixed;right:18px;bottom:18px;z-index:5;font-size:13px;text-decoration:none;
  color:#ffe3ec;padding:9px 16px;border-radius:999px;
  background:rgba(255,90,140,.18);border:1px solid rgba(255,150,185,.42);
  backdrop-filter:blur(6px);opacity:0;transform:translateY(10px);
  transition:opacity 1.4s ease,transform 1.4s ease,background .25s ease;
  pointer-events:none;
}
.toletter.show{opacity:1;transform:none;pointer-events:auto}
.toletter:hover{background:rgba(255,90,140,.34)}

/* —— 🎵 背景音乐 —— */
.music{
  position:fixed;right:18px;top:14px;z-index:7;width:44px;height:44px;border-radius:50%;
  display:flex;align-items:center;justify-content:center;cursor:pointer;padding:0;
  background:rgba(255,255,255,.07);border:1px solid rgba(255,180,205,.28);
  backdrop-filter:blur(6px);transition:background .25s ease,border-color .25s ease;
}
.music:hover{background:rgba(255,120,160,.2);border-color:rgba(255,140,180,.5)}
.music .ico{font-size:17px;line-height:1;color:rgba(255,214,228,.78);transition:opacity .25s ease,color .3s ease}
.music .x{position:absolute;font-size:14px;line-height:1;color:#ffd9e6;opacity:0;transition:opacity .25s ease}
.music.on:hover .ico{opacity:0}
.music.on:hover .x{opacity:1}
.music .disc{position:absolute;inset:4px;border-radius:50%;border:1px dashed rgba(255,170,200,.4);opacity:0;transition:opacity .3s ease}
.music.on .ico{color:#fff}
.music.on .disc{opacity:1;animation:spin 7s linear infinite}
.music.on{animation:breathe 3.2s ease-in-out infinite}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes breathe{0%,100%{box-shadow:0 0 0 0 rgba(255,90,140,.30)}50%{box-shadow:0 0 16px 4px rgba(255,90,140,.22)}}
.nowplaying{
  position:fixed;right:18px;top:64px;z-index:7;font-size:12px;letter-spacing:.1em;
  color:rgba(255,214,228,.88);background:rgba(20,10,24,.5);border:1px solid rgba(255,170,200,.22);
  padding:6px 12px;border-radius:999px;backdrop-filter:blur(6px);white-space:nowrap;
  opacity:0;transform:translateY(-6px);transition:opacity .6s ease,transform .6s ease;pointer-events:none;
}
.nowplaying.show{opacity:1;transform:none}

@media (prefers-reduced-motion:reduce){
  .caption,.hint,.toletter{transition:none}
  .music.on,.music.on .disc{animation:none}
}
</style>
</head>
<body>
<canvas id="stage"></canvas>
<a class="back" href="/">← 回到信</a>

<div class="caption" id="caption">
  <div class="line" id="capLine">愿你如玫瑰，永远盛开</div>
  <div class="sign" id="capSign">—— 连天瑜</div>
  <div class="days" id="capDays"></div>
</div>
<div class="hint" id="hint">轻触屏幕，接住一颗流星</div>
<div class="love" id="love"></div>
<a class="toletter" id="toletter" href="/">读那封信 →</a>

<button class="music" id="musicBtn" type="button" aria-label="背景音乐" title="点一下，放首歌">
  <span class="disc"></span><span class="ico">♪</span><span class="x">✕</span>
</button>
<div class="nowplaying" id="nowPlaying"></div>

<script>
(function(){
"use strict";

/* ============================================================
   ✏️ 想改内容就改这里
   ============================================================ */
var CONFIG = {
  name: "韩玉",
  caption: "愿你如玫瑰，永远盛开",
  signature: "—— 连天瑜",
  nameFontFamily: '"Kaiti SC","STKaiti","KaiTi","楷体","FangSong",serif',

  /* —— 清晰度 —— */
  sampleStep: 3,             // 采样步长（CSS 像素）：3=清晰；2=更细腻（粒子翻倍）
  maxParticles: 26000,
  maxBufferPixels: 6500000,  // 粒子画布像素上限（超大屏自动降渲染倍率，保证流畅）
  maxDPR: 3,                 // 最高设备倍率
  minRenderScale: 0.6,       // 渲染倍率下限
  dotRadius: 1.0,            // 点半径（设备像素）：越小越锐利
  bloom: 0.18,               // 泛光：0=完全锐利，越小越清晰
  sparkle: 0.06,             // 亮点比例（质感）

  /* —— 转场 —— */
  morphMs: 1250,
  staggerMs: 240,
  holdNameMs: 6200,
  holdRoseMs: 9000,
  idleJitter: 0.55,
  clickBurst: 1.15,

  /* —— 🎆 氛围：流星雨 / 烟花 / 背景 —— */
  meteorRate: 0.85,          // 流星频率（每秒出现概率）
  meteorBurst: 0.06,         // 流星雨爆发概率（偶尔成片划过）
  fireworkEveryMs: 45000,    // 自动烟花间隔（毫秒）；整点必放
  fireworkOnRose: true,      // 玫瑰绽放时是否放烟花庆祝
  nebula: true,              // 星云背景
  cometTail: true,           // 许愿星拖尾

  /* —— 💗 创意一：心跳律动 —— */
  heartbeat: true,           // 形状按心跳节拍搏动（而不是普通呼吸）
  heartBpm: 52,              // 心动周期（越小越快）
  heartGrowMs: 90000,        // 待多久之后心跳最明显

  /* —— 💗 创意二：和那封信同步的「在一起」计时 —— */
  syncKey: "loveStart",      // 与那封信共用同一个开始时刻（她点下「我愿意」的那一秒）
  sinceFallback: "",         // 兜底日期，如 "2026-09-15"；留空 = 没记录就整行不显示
  sinceLabel: "在一起的第",  // 文案前半（与信上一致）
  sinceUnit: "天",           // 文案后半
  sinceClock: true,          // 再跟一个和信上同步走动的时钟

  /* —— 💗 创意三：许愿流星 —— */
  wishMax: 9,                // 天上最多挂几颗许愿星
  wishLines: [
    "愿你所愿皆成真",
    "你笑起来最好看",
    "遇见你，是我最好的运气",
    "想陪你走很远很远",
    "你值得世间所有温柔",
    "谢谢你出现在我的世界里",
    "有你在，日子都是甜的",
    "要一直这么好看下去呀"
  ],

  /* —— 🎵 背景音乐 —— */
  musicAuto: true,           // 她第一次碰屏幕时自动开始播放
  musicVolume: 0.34,         // 音量上限（0~1）
  musicTitle: "在你的身边 — 盛哲",
  lullabyTitle: "送你的小夜曲 · 现场合成",
  /* —— 🎵 背景音乐（《在你的身边》— 盛哲）——
     把歌放进站点 music/ 文件夹，文件名用下面任意一个都认（mp3 / m4a / flac / wav 都行） */
  musicSources: [
    "https://cdn.jsdelivr.net/gh/tianyu5666/tianyu5666.github.io@a8f4635d5416557049f32bf01ccf26e4e31e42e3/music/zainishenbian.mp3",
    "music/zainishenbian.mp3",
    "music/在你的身边.mp3"
  ],
  lullabyFallback: false     // 没有歌时是否用内置小夜曲顶替（false＝没有歌就整个不显示 ♪ 按钮）
};

var canvas = document.getElementById("stage");
var ctx = canvas.getContext("2d", { alpha: false });
var W = 0, H = 0, DPR = 1, RS = 1;   /* RS = 实际渲染倍率（可能因缓冲上限而低于 DPR） */
var reduceMotion = window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches;

var pCanvas, pCtx, pImg, buf32, BW = 0, BH = 0;
var bloomCanvas, bloomCtx;

function rand(a, b){ return a + Math.random() * (b - a); }
function lerp(a, b, t){ return a + (b - a) * t; }
function clamp(v, a, b){ return Math.min(b, Math.max(a, v)); }
function easeInOutCubic(t){ return t < 0.5 ? 4*t*t*t : 1 - Math.pow(-2*t + 2, 3) / 2; }

/* ============================================================
   点阵：预计算"一个点"覆盖哪些像素、每层亮度
   ============================================================ */
var dotOffsets = [], dotLevels = 8;
function buildDot(rDev){
  dotOffsets = [];
  var r = Math.max(0.7, rDev);
  var R = Math.ceil(r);
  for (var dy = -R; dy <= R; dy++){
    for (var dx = -R; dx <= R; dx++){
      var d = Math.sqrt(dx*dx + dy*dy);
      if (d > r + 0.25) continue;
      /* 硬核心 + 窄过渡 = 锐利 */
      var b = d <= r * 0.72 ? 1 : Math.pow(1 - (d - r * 0.72) / (r * 0.45), 0.85);
      b = clamp(b, 0.12, 1);
      dotOffsets.push({ dx: dx, dy: dy, lv: Math.min(dotLevels - 1, Math.max(0, Math.round(b * (dotLevels - 1)))) });
    }
  }
}

/* ============================================================
   采样
   ============================================================ */
function sampleCanvas(src, stepDev){
  var w = src.width, h = src.height;
  var data = src.getContext("2d", { willReadFrequently: true }).getImageData(0, 0, w, h).data;
  var pts = [];
  for (var y = 0; y < h; y += stepDev){
    for (var x = 0; x < w; x += stepDev){
      var i = (y * w + x) * 4;
      if (data[i + 3] < 120) continue;
      pts.push({ x: x, y: y, r: data[i], g: data[i+1], b: data[i+2] });
    }
  }
  return pts;
}

/* 名字：按设备像素渲染文字 → 采样 → 粉红渐变 */
function buildNamePoints(){
  var scale = RS;
  var cssW = clamp(W - 40, 240, 1180);
  var cssH = clamp(H * 0.46, 150, 400);
  var off = document.createElement("canvas");
  off.width = Math.floor(cssW * scale);
  off.height = Math.floor(cssH * scale);
  var c = off.getContext("2d", { willReadFrequently: true });
  c.scale(scale, scale);
  c.fillStyle = "#fff";
  c.textAlign = "center";
  c.textBaseline = "middle";
  var size = Math.floor(cssH * 0.8);
  do {
    c.font = "700 " + size + "px " + CONFIG.nameFontFamily;
    size -= 2;
  } while (size > 40 && c.measureText(CONFIG.name).width > cssW * 0.88);
  c.font = "700 " + (size + 2) + "px " + CONFIG.nameFontFamily;
  c.fillText(CONFIG.name, cssW / 2, cssH / 2);

  var stepDev = Math.max(2, Math.round(CONFIG.sampleStep * scale));
  var raw = sampleCanvas(off, stepDev);
  var out = [];
  for (var i = 0; i < raw.length; i++){
    var p = raw[i];
    var t = p.y / off.height;
    out.push({
      x: (p.x - off.width / 2) / scale,
      y: (p.y - off.height / 2) / scale,
      r: Math.round(lerp(255, 226, t)),
      g: Math.round(lerp(158, 34, t)),
      b: Math.round(lerp(200, 92, t))
    });
  }
  return out;
}

/* 玫瑰：优先系统彩色 emoji（颜色最真），失败则手绘 */
function buildRoseCanvas(sizeDev){
  var off = document.createElement("canvas");
  off.width = off.height = sizeDev;
  var c = off.getContext("2d", { willReadFrequently: true });

  c.textAlign = "center";
  c.textBaseline = "middle";
  c.font = Math.floor(sizeDev * 0.86) + 'px "Segoe UI Emoji","Apple Color Emoji","Noto Color Emoji",sans-serif';
  c.fillText("🌹", sizeDev / 2, sizeDev * 0.54);

  var probe = c.getImageData(0, 0, sizeDev, sizeDev).data;
  var red = 0, green = 0;
  for (var i = 0; i < probe.length; i += 4 * 37){
    if (probe[i+3] > 120){
      if (probe[i] > 120 && probe[i+1] < 110 && probe[i+2] < 120) red++;
      if (probe[i+1] > 90 && probe[i] < 130) green++;
    }
  }
  if (red > 120 && green > 25) return off;

  /* 手绘玫瑰 */
  c.clearRect(0, 0, sizeDev, sizeDev);
  var cx = sizeDev * 0.5, cy = sizeDev * 0.42, R = sizeDev * 0.30;
  var sg = c.createLinearGradient(cx - 8, cy, cx + 8, sizeDev * 0.95);
  sg.addColorStop(0, "#4e8f3d"); sg.addColorStop(1, "#2f6b28");
  c.strokeStyle = sg; c.lineWidth = sizeDev * 0.018; c.lineCap = "round";
  c.beginPath();
  c.moveTo(cx, cy + R * 0.85);
  c.quadraticCurveTo(cx + sizeDev * 0.035, sizeDev * 0.72, cx + sizeDev * 0.012, sizeDev * 0.96);
  c.stroke();
  function leaf(px, py, dir, scale){
    c.save(); c.translate(px, py); c.rotate(dir * 0.5);
    var lg = c.createLinearGradient(0, 0, dir * sizeDev * 0.16 * scale, 0);
    lg.addColorStop(0, "#6cbb50"); lg.addColorStop(1, "#2f6b28");
    c.fillStyle = lg;
    c.beginPath(); c.moveTo(0, 0);
    c.quadraticCurveTo(dir * sizeDev * 0.09 * scale, -sizeDev * 0.05 * scale, dir * sizeDev * 0.17 * scale, 0);
    c.quadraticCurveTo(dir * sizeDev * 0.09 * scale, sizeDev * 0.05 * scale, 0, 0);
    c.fill(); c.restore();
  }
  leaf(cx, sizeDev * 0.72, 1, 1);
  leaf(cx + sizeDev * 0.01, sizeDev * 0.83, -1, 0.82);
  var layers = [
    { n: 7, rr: 1.00, col: ["#8e0f24", "#d22043"], off: 0.00 },
    { n: 6, rr: 0.78, col: ["#b3122b", "#e8385c"], off: 0.34 },
    { n: 5, rr: 0.56, col: ["#d81b45", "#ff5c7d"], off: 0.66 },
    { n: 4, rr: 0.34, col: ["#ff4d6d", "#ff9db4"], off: 0.95 }
  ];
  layers.forEach(function(L, li){
    for (var k = 0; k < L.n; k++){
      var a = (k / L.n) * Math.PI * 2 + L.off + li * 0.4;
      var px = cx + Math.cos(a) * R * L.rr * 0.42;
      var py = cy + Math.sin(a) * R * L.rr * 0.42;
      var grd = c.createRadialGradient(px, py, 0, px, py, R * L.rr * 0.62);
      grd.addColorStop(0, L.col[1]); grd.addColorStop(1, L.col[0]);
      c.fillStyle = grd;
      c.save(); c.translate(px, py); c.rotate(a + Math.PI / 2);
      c.beginPath(); c.ellipse(0, 0, R * L.rr * 0.52, R * L.rr * 0.38, 0, 0, Math.PI * 2);
      c.fill(); c.restore();
    }
  });
  return off;
}

function buildRosePoints(){
  var cssSize = Math.max(230, Math.min(W * 0.6, H * 0.72));
  var sizeDev = Math.floor(cssSize * RS);
  var off = buildRoseCanvas(sizeDev);
  var stepDev = Math.max(2, Math.round(CONFIG.sampleStep * RS));
  var raw = sampleCanvas(off, stepDev);
  var out = [];
  for (var i = 0; i < raw.length; i++){
    var p = raw[i];
    out.push({
      x: (p.x - sizeDev / 2) / RS,
      y: (p.y - sizeDev * 0.5) / RS,
      r: p.r, g: p.g, b: p.b
    });
  }
  return out;
}

/* ============================================================
   粒子
   ============================================================ */
var particles = [];
var namePts = [], rosePts = [];
var phase = "name";
var phaseUntil = 0, time = 0, last = 0;
var paletteCache = {};
var perf = { fps: 0, particles: 0, dpr: 1, bufferPixels: 0, frames: 0, acc: 0, namePts: 0, rosePts: 0 };
window.__perf = perf;
/* 调试探针：配对行程与单粒子轨迹（供自检用） */
window.__travel = { avg: 0, max: 0 };
window.__probe = function(i){ var p = particles[i]; if(!p) return null; return { x:+p.x.toFixed(2), y:+p.y.toFixed(2), tx:+p.tx.toFixed(2), ty:+p.ty.toFixed(2), u:+(((time - p.t0) / p.dur) >= 0 ? Math.min(1,(time - p.t0)/p.dur) : 0).toFixed(3) }; };

function packColor(r, g, b){
  var key = ((r >> 2) << 12) | ((g >> 2) << 6) | (b >> 2);
  var arr = paletteCache[key];
  if (arr) return arr;
  var levels = new Uint32Array(dotLevels);
  for (var i = 0; i < dotLevels; i++){
    var k = (i + 1) / dotLevels;
    var rr = Math.min(255, Math.round(r * k));
    var gg = Math.min(255, Math.round(g * k));
    var bb = Math.min(255, Math.round(b * k));
    /* ImageData 为 RGBA 字节序，小端机按 0xAABBGGRR 打包 */
    levels[i] = (255 << 24) | (bb << 16) | (gg << 8) | rr;
  }
  paletteCache[key] = levels;
  return levels;
}

function makeParticles(count){
  particles.length = 0;
  for (var i = 0; i < count; i++){
    var a = Math.random() * Math.PI * 2;
    var d = rand(Math.max(W, H) * 0.5, Math.max(W, H) * 0.95);
    particles.push({
      x: W / 2 + Math.cos(a) * d,
      y: H / 2 + Math.sin(a) * d,
      sx: 0, sy: 0, tx: W / 2, ty: H / 2,
      t0: 0, dur: CONFIG.morphMs, arc: 0,
      r: 255, g: 140, b: 185,
      col: packColor(255, 140, 185),
      alpha: 1,
      ph: Math.random() * Math.PI * 2,
      bright: Math.random() < CONFIG.sparkle
    });
  }
}

/* 目标点按极角排序，粒子也按当前极角排序 → 就近配对，转场不乱穿 */
function sortByPolar(pts){
  return pts.map(function(p){
    return { p: p, a: Math.atan2(p.y, p.x), r: Math.sqrt(p.x*p.x + p.y*p.y) };
  }).sort(function(u, v){ return u.a - v.a || u.r - v.r; }).map(function(o){ return o.p; });
}

function assignTargets(pts, instant){
  var n = particles.length;
  var order = [];
  for (var i = 0; i < n; i++){
    var p = particles[i];
    order.push({ i: i, a: Math.atan2(p.y - H / 2, p.x - W / 2) });
  }
  order.sort(function(u, v){ return u.a - v.a; });

  var maxTravel = 1, sumTravel = 0, cntTravel = 0, maxT = 0;
  for (var k = 0; k < n; k++){
    if (k >= pts.length) break;
    var q0 = particles[order[k].i];
    var dx0 = (W / 2 + pts[k].x) - q0.x, dy0 = (H / 2 + pts[k].y) - q0.y;
    var dist0 = Math.sqrt(dx0*dx0 + dy0*dy0);
    if (dist0 > maxTravel) maxTravel = dist0;
  }

  for (k = 0; k < n; k++){
    var idx = order[k].i, q = particles[idx];
    if (k < pts.length){
      var t = pts[k];
      q.tx = W / 2 + t.x;
      q.ty = H / 2 + t.y;
      q.r = t.r; q.g = t.g; q.b = t.b;
      q.col = packColor(t.r, t.g, t.b);
      q.alpha = 1;
    } else {
      var a2 = (k / n) * Math.PI * 2 + time * 0.0004;
      var d2 = Math.min(W, H) * rand(0.44, 0.6);
      q.tx = W / 2 + Math.cos(a2) * d2;
      q.ty = H / 2 + Math.sin(a2) * d2 * 0.72;
      q.r = 255; q.g = 196; q.b = 220;
      q.col = packColor(255, 196, 220);
      q.alpha = 0.42;
    }
    q.sx = q.x; q.sy = q.y;
    if (instant || reduceMotion){
      q.t0 = 0; q.dur = 1;
      q.x = q.tx; q.y = q.ty;
    } else {
      var travel = Math.sqrt((q.tx - q.sx) * (q.tx - q.sx) + (q.ty - q.sy) * (q.ty - q.sy));
      sumTravel += travel; cntTravel++; if (travel > maxT) maxT = travel;
      window.__travel = { avg: Math.round(sumTravel / cntTravel), max: Math.round(maxT), cnt: cntTravel };
      q.t0 = time + (travel / maxTravel) * CONFIG.staggerMs;
      q.dur = CONFIG.morphMs;
      q.arc = (Math.random() - 0.5) * travel * 0.09;   /* 弧线只与行程成正比 → 近距离走直线，远距离轻弧 */
    }
  }
}

function setPhase(next, instant){
  phase = next;
  if (next === "name"){
    assignTargets(namePts, instant);
    phaseUntil = time + CONFIG.holdNameMs;
    caption.classList.remove("show");
    toletter.classList.remove("show");
  } else {
    assignTargets(rosePts, instant);
    phaseUntil = time + CONFIG.holdRoseMs;
    caption.classList.add("show");
    toletter.classList.add("show");
    /* 玫瑰绽放 → 放两束烟花庆祝 */
    if (CONFIG.fireworkOnRose){
      launchFirework();
      setTimeout(function(){ launchFirework(); }, 560);
    }
  }
}

var stars = [], bgGrad = null, haloGrad = null, nebula = null;
function buildBackground(){
  stars.length = 0;
  var n = Math.round(clamp((W * H) / 15000, 60, 220));
  for (var i = 0; i < n; i++){
    stars.push({ x: Math.random() * W, y: Math.random() * H, r: rand(0.35, 1.4), p: Math.random() * Math.PI * 2, s: rand(0.6, 1.7) });
  }
  bgGrad = ctx.createRadialGradient(W * 0.5, H * 0.46, 0, W * 0.5, H * 0.46, Math.max(W, H) * 0.78);
  bgGrad.addColorStop(0, "#190d18");
  bgGrad.addColorStop(0.45, "#100813");
  bgGrad.addColorStop(1, "#06050a");
  haloGrad = ctx.createRadialGradient(W / 2, H / 2, 0, W / 2, H / 2, Math.min(W, H) * 0.55);
  haloGrad.addColorStop(0, "rgba(255,70,120,.10)");
  haloGrad.addColorStop(0.5, "rgba(255,60,110,.04)");
  haloGrad.addColorStop(1, "rgba(255,60,110,0)");
  /* 星云背景：预渲染一次，每帧只做位移叠加（省性能） */
  if (CONFIG.nebula){
    nebula = document.createElement("canvas");
    nebula.width = Math.max(1, Math.floor(W / 3));
    nebula.height = Math.max(1, Math.floor(H / 3));
    var nc = nebula.getContext("2d");
    var blobs = [
      { x: 0.24, y: 0.30, r: 0.55, c: "rgba(255,90,150,.20)" },
      { x: 0.76, y: 0.24, r: 0.48, c: "rgba(150,110,255,.16)" },
      { x: 0.52, y: 0.78, r: 0.58, c: "rgba(255,130,90,.13)" },
      { x: 0.14, y: 0.82, r: 0.44, c: "rgba(120,180,255,.11)" }
    ];
    blobs.forEach(function(b){
      var bg2 = nc.createRadialGradient(b.x * nebula.width, b.y * nebula.height, 0,
                                        b.x * nebula.width, b.y * nebula.height,
                                        b.r * Math.max(nebula.width, nebula.height));
      bg2.addColorStop(0, b.c);
      bg2.addColorStop(1, "rgba(0,0,0,0)");
      nc.fillStyle = bg2;
      nc.fillRect(0, 0, nebula.width, nebula.height);
    });
  } else {
    nebula = null;
  }
}

function drawBackground(){
  ctx.globalCompositeOperation = "source-over";
  ctx.globalAlpha = 1;
  ctx.fillStyle = bgGrad;
  ctx.fillRect(0, 0, W, H);

  ctx.globalCompositeOperation = "lighter";
  for (var i = 0; i < stars.length; i++){
    var s = stars[i];
    ctx.globalAlpha = 0.16 + 0.30 * (0.5 + 0.5 * Math.sin(time * 0.0012 * s.s + s.p));
    ctx.fillStyle = "#ffd7e6";
    ctx.beginPath();
    ctx.arc(s.x, s.y, s.r, 0, Math.PI * 2);
    ctx.fill();
  }
  ctx.globalAlpha = 1;
  /* 星云缓慢漂移（叠加发光） */
  if (nebula){
    var ndx = Math.sin(time * 0.00006) * W * 0.04;
    var ndy = Math.cos(time * 0.00005) * H * 0.03;
    ctx.globalAlpha = 0.85;
    ctx.drawImage(nebula, -W * 0.05 + ndx, -H * 0.05 + ndy, W * 1.1, H * 1.1);
    ctx.globalAlpha = 1;
  }
  ctx.fillStyle = haloGrad;
  ctx.fillRect(0, 0, W, H);
  ctx.globalCompositeOperation = "source-over";
}

var meteors = [];
function spawnMeteor(){
  var fromLeft = Math.random() < 0.5;
  var speed = rand(540, 1000) * (W / 1300 + 0.65);
  var ang = rand(0.42, 0.62);
  meteors.push({
    x: fromLeft ? rand(-W * 0.12, W * 0.55) : rand(W * 0.45, W * 1.12),
    y: rand(-H * 0.18, H * 0.32),
    vx: (fromLeft ? 1 : -1) * Math.cos(ang) * speed,
    vy: Math.sin(ang) * speed,
    len: rand(130, 330), life: rand(1.1, 1.9), t: 0, w: rand(1.2, 2.4)
  });
}
function updateMeteors(dt){
  if (Math.random() < CONFIG.meteorRate * dt / 1000) spawnMeteor();
  if (Math.random() < CONFIG.meteorBurst * dt / 1000){
    var n = 3 + Math.floor(Math.random() * 4);
    for (var k = 0; k < n; k++) setTimeout(spawnMeteor, k * rand(90, 220));
  }
  for (var i = meteors.length - 1; i >= 0; i--){
    var m = meteors[i];
    m.t += dt / 1000;
    m.x += m.vx * dt / 1000;
    m.y += m.vy * dt / 1000;
    if (m.t > m.life || m.y > H + 140 || m.x < -340 || m.x > W + 340) meteors.splice(i, 1);
  }
}
function drawMeteors(){
  if (!meteors.length) return;
  ctx.globalCompositeOperation = "lighter";
  for (var i = 0; i < meteors.length; i++){
    var m = meteors[i];
    var k = clamp(m.t / m.life, 0, 1);
    var alpha = Math.sin(Math.PI * k) * 0.95;
    var nl = Math.sqrt(m.vx * m.vx + m.vy * m.vy) || 1;
    var tx = m.x - m.vx / nl * m.len, ty = m.y - m.vy / nl * m.len;
    var g = ctx.createLinearGradient(m.x, m.y, tx, ty);
    g.addColorStop(0, "rgba(255,255,255," + alpha.toFixed(3) + ")");
    g.addColorStop(0.22, "rgba(255,214,236," + (alpha * 0.55).toFixed(3) + ")");
    g.addColorStop(1, "rgba(255,180,215,0)");
    ctx.strokeStyle = g;
    ctx.lineWidth = m.w;
    ctx.lineCap = "round";
    ctx.beginPath(); ctx.moveTo(m.x, m.y); ctx.lineTo(tx, ty); ctx.stroke();
    ctx.globalAlpha = alpha;
    ctx.fillStyle = "#fff";
    ctx.beginPath(); ctx.arc(m.x, m.y, m.w * 0.95, 0, Math.PI * 2); ctx.fill();
    ctx.globalAlpha = 1;
  }
  ctx.globalCompositeOperation = "source-over";
}

   🎆 烟花
   ============================================================ */
var rockets = [], sparks = [];
var FIRE_HUES = [340, 350, 5, 320, 300, 45];
function launchFirework(x, hue){
  rockets.push({
    x: x == null ? rand(W * 0.2, W * 0.8) : x,
    y: H + 12,
    vx: rand(-24, 24),
    vy: -rand(430, 640),
    hue: hue == null ? FIRE_HUES[Math.floor(Math.random() * FIRE_HUES.length)] : hue,
    top: rand(H * 0.14, H * 0.40)
  });
}
function explodeFirework(x, y, hue){
  var n = Math.round(rand(72, 122));
  for (var i = 0; i < n; i++){
    var a = (i / n) * Math.PI * 2 + rand(-0.06, 0.06);
    var sp = rand(85, 320);
    var life = rand(0.9, 1.7);
    sparks.push({ x: x, y: y, vx: Math.cos(a) * sp, vy: Math.sin(a) * sp,
                  life: life, max: life, h: hue + rand(-16, 16), w: rand(1.4, 2.6) });
  }
}
function updateFireworks(dt){
  var s = dt / 1000;
  for (var i = rockets.length - 1; i >= 0; i--){
    var r = rockets[i];
    r.vy += 300 * s;
    r.x += r.vx * s;
    r.y += r.vy * s;
    if (r.vy > -40 || r.y < r.top){
      explodeFirework(r.x, r.y, r.hue);
      rockets.splice(i, 1);
    }
  }
  for (i = sparks.length - 1; i >= 0; i--){
    var p = sparks[i];
    p.vy += 145 * s;
    p.vx *= 0.987; p.vy *= 0.987;
    p.x += p.vx * s;
    p.y += p.vy * s;
    p.life -= s;
    if (p.life <= 0) sparks.splice(i, 1);
  }
  if (sparks.length > 900) sparks.splice(0, sparks.length - 900);
}
function drawFireworks(){
  if (!rockets.length && !sparks.length) return;
  ctx.globalCompositeOperation = "lighter";
  for (var i = 0; i < rockets.length; i++){
    var r = rockets[i];
    var g = ctx.createRadialGradient(r.x, r.y, 0, r.x, r.y, 13);
    g.addColorStop(0, "rgba(255,244,250,.95)");
    g.addColorStop(1, "rgba(255,150,205,0)");
    ctx.fillStyle = g;
    ctx.beginPath(); ctx.arc(r.x, r.y, 13, 0, Math.PI * 2); ctx.fill();
  }
  for (i = 0; i < sparks.length; i++){
    var p = sparks[i];
    var k = clamp(p.life / p.max, 0, 1);
    ctx.globalAlpha = k;
    ctx.fillStyle = "hsl(" + p.h.toFixed(0) + ",92%," + (56 + 24 * k).toFixed(0) + "%)";
    ctx.beginPath();
    ctx.arc(p.x, p.y, p.w * (0.45 + 0.95 * k), 0, Math.PI * 2);
    ctx.fill();
  }
  ctx.globalAlpha = 1;
  ctx.globalCompositeOperation = "source-over";
}

  });

function updateWishes(dt){

    var w = wishes[i];

  }

function drawWishes(){

  ctx.globalCompositeOperation = "lighter";
  for (var i = 0; i < wishes.length; i++){
    var w = wishes[i];
    var e = easeInOutCubic(w.t);
    var x = lerp(w.x, w.tx, e);
    var y = lerp(w.y, w.ty, e);
    var tw = 0.65 + 0.35 * Math.sin(time * 0.0024 + w.ph);
    if (CONFIG.cometTail && w.t < 1){
      var ex = lerp(w.x, w.tx, Math.max(0, e - 0.25));
      var ey = lerp(w.y, w.ty, Math.max(0, e - 0.25));
      var g = ctx.createLinearGradient(x, y, ex, ey);
      g.addColorStop(0, "rgba(255,235,245,.6)");
      g.addColorStop(1, "rgba(255,180,215,0)");
      ctx.strokeStyle = g;
      ctx.lineWidth = 2.2;
      ctx.beginPath(); ctx.moveTo(x, y); ctx.lineTo(ex, ey); ctx.stroke();
    }
    var r = 11 + 4 * tw;
    var rg = ctx.createRadialGradient(x, y, 0, x, y, r);
    rg.addColorStop(0, "rgba(255,255,255," + (0.95 * tw).toFixed(2) + ")");
    rg.addColorStop(0.35, "rgba(255,214,236," + (0.5 * tw).toFixed(2) + ")");
    rg.addColorStop(1, "rgba(255,180,215,0)");
    ctx.fillStyle = rg;
    ctx.beginPath(); ctx.arc(x, y, r, 0, Math.PI * 2); ctx.fill();
  }
  ctx.globalCompositeOperation = "source-over";
}

/* ============================================================
   💗 创意一：心跳律动（不是普通呼吸，而是"咚·咚—"的心跳）
   ============================================================ */
var pageStart = 0;
function heartbeatScale(t){
  if (!CONFIG.heartbeat) return 1 + 0.010 * Math.sin(t * 0.0015);
  var deep = pageStart ? clamp((t - pageStart) / CONFIG.heartGrowMs, 0, 1) : 0;
  var period = 60000 / CONFIG.heartBpm;
  var p = pageStart ? (((t - pageStart) % period) / period) : 0;
  var b1 = Math.exp(-Math.pow((p - 0.05) / 0.045, 2));
  var b2 = Math.exp(-Math.pow((p - 0.20) / 0.055, 2)) * 0.62;
  return 1 + (b1 + b2) * (0.009 + 0.013 * deep);
}

/* 💗 创意二：和那封信同步的「在一起」计时
   · 与首页那封信共用 localStorage.loveStart（她点下「我愿意」的那一秒）
   · 同一个站点 → 同源 → 自动同步；换设备/换浏览器时用 sinceFallback 兜底
   · 完全没有记录时，这一行干脆不出现（不编造一个假日期） */
function loveStart(){
  try{
    var v = parseInt(localStorage.getItem(CONFIG.syncKey), 10);
    if (v > 0) return v;
  }catch(e){}
  var f = CONFIG.sinceFallback;
  if (typeof f === "string" && f){
    var d = Date.parse(f + (f.length <= 10 ? "T00:00:00" : ""));
    if (d > 0) return d;
  } else if (typeof f === "number" && f > 0){
    return f;
  }
  return 0;
}
function pad2(n){ return (n < 10 ? "0" : "") + n; }

var daysEl = document.getElementById("capDays"), startAt = 0;
function tickTogether(){
  if (!startAt) return;
  var diff = Math.max(0, Date.now() - startAt);
  var days = Math.floor(diff / 86400000) + 1;          /* 与她点下「我愿意」那天算第 1 天 */
  var rest = diff % 86400000;
  var s = CONFIG.sinceLabel + " " + days + " " + CONFIG.sinceUnit;
  if (CONFIG.sinceClock){
    s += " · " + pad2(Math.floor(rest / 3600000)) + ":" + pad2(Math.floor(rest % 3600000 / 60000)) + ":" + pad2(Math.floor(rest % 60000 / 1000));
  }
  daysEl.textContent = s;
}
function initTogether(){
  startAt = loveStart();
  if (!startAt){ daysEl.style.display = "none"; return; }
  tickTogether();
  setInterval(tickTogether, 1000);
}
window.__love = { start: loveStart, init: initTogether, cfg: CONFIG };

var petals = [];
function spawnPetal(){
  var s = Math.min(W, H);
  petals.push({
    x: W / 2 + rand(-s * 0.24, s * 0.24),
    y: H / 2 - s * 0.22 + rand(-10, 30),
    vx: rand(-0.3, 0.3), vy: rand(0.35, 0.85),
    rot: Math.random() * Math.PI, vr: rand(-0.02, 0.02),
    s: rand(3.0, 6.0), a: rand(0.5, 0.9)
  });
}
function drawPetals(){
  if (!petals.length) return;
  ctx.globalCompositeOperation = "source-over";
  for (var i = petals.length - 1; i >= 0; i--){
    var p = petals[i];
    p.x += p.vx + Math.sin((time + i * 90) * 0.0016) * 0.5;
    p.y += p.vy;
    p.rot += p.vr;
    if (p.y > H + 30){ petals.splice(i, 1); continue; }
    ctx.save();
    ctx.translate(p.x, p.y);
    ctx.rotate(p.rot);
    ctx.globalAlpha = p.a;
    ctx.fillStyle = "#e0245e";
    ctx.beginPath();
    ctx.ellipse(0, 0, p.s, p.s * 0.62, 0, 0, Math.PI * 2);
    ctx.fill();
    ctx.restore();
  }
  ctx.globalAlpha = 1;
}

/* ============================================================
   粒子渲染：写进像素缓冲（锐利且快）
   ============================================================ */
function renderParticles(){
  buf32.fill(0);
  var cx = W / 2, cy = H / 2;
  var breathe = heartbeatScale(time);   /* 💗 心跳律动 */
  var offs = dotOffsets, offLen = offs.length;

  for (var i = 0; i < particles.length; i++){
    var p = particles[i];
    var u = time < p.t0 ? 0 : clamp((time - p.t0) / p.dur, 0, 1);
    var e = easeInOutCubic(u);
    var px = lerp(p.sx, p.tx, e);
    var py = lerp(p.sy, p.ty, e);
    if (u >= 1){
      px += Math.sin(time * 0.0014 + p.ph) * CONFIG.idleJitter;
      py += Math.cos(time * 0.0012 + p.ph * 1.6) * CONFIG.idleJitter;
    } else if (p.arc){
      var s = Math.sin(Math.PI * u) * p.arc;
      var dx = p.tx - p.sx, dy = p.ty - p.sy;
      var len = Math.sqrt(dx*dx + dy*dy) || 1;
      px += (-dy / len) * s;
      py += (dx / len) * s;
    }
    p.x = px; p.y = py;

    var X = Math.round((cx + (px - cx) * breathe) * RS);
    var Y = Math.round((cy + (py - cy) * breathe) * RS);
    if (X < -4 || Y < -4 || X > BW + 4 || Y > BH + 4) continue;

    var col = p.col;
    var a = p.alpha;
    for (var k = 0; k < offLen; k++){
      var o = offs[k];
      var xx = X + o.dx, yy = Y + o.dy;
      if (xx < 0 || yy < 0 || xx >= BW || yy >= BH) continue;
      var lv = o.lv;
      if (p.bright) lv = Math.min(dotLevels - 1, lv + 2);
      var packed = col[lv];
      var idx = yy * BW + xx;
      if (a >= 1){ buf32[idx] = packed; }
      else if (buf32[idx] === 0 || a > 0.55){ buf32[idx] = packed; }
    }
  }
  pCtx.putImageData(pImg, 0, 0);
}

/* ============================================================
   主循环
   ============================================================ */
var caption = document.getElementById("caption");
var toletter = document.getElementById("toletter");
var hint = document.getElementById("hint");

function frame(now){
  if (!last) last = now;
  var dt = now - last;
  last = now;
  time = now;

  perf.frames++;
  perf.meteors = meteors.length;
  perf.rockets = rockets.length;
  perf.sparks = sparks.length;
  perf.wishes = wishes.length;
  perf.acc += dt;
  if (perf.acc >= 1000){
    perf.fps = Math.round(perf.frames * 1000 / perf.acc);
    perf.frames = 0; perf.acc = 0;
  }

  /* 背景与花瓣在 CSS 坐标下绘制（按 RS 缩放） */
  ctx.setTransform(RS, 0, 0, RS, 0, 0);
  drawBackground();

  /* 粒子：1:1 设备像素合成（不重采样 → 更锐利、也更快） */
  renderParticles();
  ctx.setTransform(1, 0, 0, 1, 0, 0);
  ctx.globalCompositeOperation = "source-over";
  ctx.globalAlpha = 1;
  ctx.drawImage(pCanvas, 0, 0);

  if (CONFIG.bloom > 0){
    bloomCtx.clearRect(0, 0, bloomCanvas.width, bloomCanvas.height);
    bloomCtx.drawImage(pCanvas, 0, 0, bloomCanvas.width, bloomCanvas.height);
    ctx.globalCompositeOperation = "lighter";
    ctx.globalAlpha = CONFIG.bloom;
    ctx.drawImage(bloomCanvas, 0, 0, BW, BH);
    ctx.globalAlpha = 1;
    ctx.globalCompositeOperation = "source-over";
  }

  ctx.setTransform(RS, 0, 0, RS, 0, 0);
  /* 氛围层：流星雨 / 烟花 / 许愿星 */
  updateMeteors(dt);
  drawMeteors();
  updateFireworks(dt);
  drawFireworks();
  updateWishes(dt);
  drawWishes();

  if (phase === "rose"){
    if (petals.length < 24 && Math.random() < 0.05) spawnPetal();
    drawPetals();
  }

  if (time > phaseUntil) setPhase(phase === "name" ? "rose" : "name");

  requestAnimationFrame(frame);
}

/* ============================================================
   尺寸 / 交互
   ============================================================ */
function setupBuffers(){
  /* 像素预算：超大屏（4K）自动降低渲染倍率，宁可轻微上采样也要保证 60fps */
  RS = DPR;
  var px = W * H * RS * RS;
  if (px > CONFIG.maxBufferPixels){
    RS = clamp(Math.sqrt(CONFIG.maxBufferPixels / (W * H)), CONFIG.minRenderScale, DPR);
  }
  BW = Math.floor(W * RS);
  BH = Math.floor(H * RS);
  pCanvas = document.createElement("canvas");
  pCanvas.width = BW; pCanvas.height = BH;
  pCtx = pCanvas.getContext("2d");
  pImg = pCtx.createImageData(BW, BH);
  buf32 = new Uint32Array(pImg.data.buffer);

  bloomCanvas = document.createElement("canvas");
  bloomCanvas.width = Math.max(1, Math.floor(BW / 4));
  bloomCanvas.height = Math.max(1, Math.floor(BH / 4));
  bloomCtx = bloomCanvas.getContext("2d");

  canvas.width = BW; canvas.height = BH;
  canvas.style.width = W + "px";
  canvas.style.height = H + "px";
  ctx.setTransform(RS, 0, 0, RS, 0, 0);
  ctx.imageSmoothingEnabled = true;

  buildDot(CONFIG.dotRadius * RS);
  paletteCache = {};
  perf.dpr = RS;
  perf.deviceDPR = DPR;
  perf.bufferPixels = BW * BH;
}

function buildShapePoints(instant){
  namePts = sortByPolar(buildNamePoints());
  rosePts = sortByPolar(buildRosePoints());
  var count = Math.min(CONFIG.maxParticles, Math.max(namePts.length, rosePts.length));
  count = Math.max(800, count);
  makeParticles(count);
  perf.particles = count;
  perf.namePts = namePts.length;
  perf.rosePts = rosePts.length;
  assignTargets(phase === "name" ? namePts : rosePts, instant !== false);
}

function resize(){
  DPR = Math.min(CONFIG.maxDPR, window.devicePixelRatio || 1);
  W = window.innerWidth;
  H = window.innerHeight;
  setupBuffers();
  buildBackground();
  buildShapePoints(true);
}

window.addEventListener("resize", function(){
  clearTimeout(resize._t);
  resize._t = setTimeout(resize, 280);
});

function burst(x, y){
  for (var i = 0; i < particles.length; i++){
    var p = particles[i];
    var dx = p.x - x, dy = p.y - y;
    var d = Math.sqrt(dx*dx + dy*dy) || 1;
    var f = CONFIG.clickBurst * 26 * (1 - clamp(d / (Math.min(W, H) * 0.6), 0, 1));
    p.sx = p.x + (dx / d) * f;
    p.sy = p.y + (dy / d) * f;
    p.t0 = time + 40;
    p.dur = CONFIG.morphMs * 0.9;
    p.arc = (Math.random() - 0.5) * 40;
  }
  for (var k = 0; k < 6; k++) spawnPetal();
}
canvas.addEventListener("pointerdown", function(e){
  burst(e.clientX, e.clientY);      /* 粒子从点击处炸开 */
  addWish(e.clientX, e.clientY);    /* ⭐ 接住一颗流星 + 一句情话 */
});
window.addEventListener("keydown", function(e){ if (e.key === "b" || e.key === "B") burst(W / 2, H / 2); });

/* ============================================================
   🎵 背景音乐
   · 页面旁边放了歌就用歌，没放就用内置的小夜曲（Web Audio 现场合成，不占体积）
   · 浏览器不让自动出声，所以「她第一次碰屏幕」时才开始
   · 右上角的 ♪ 可以随时开/关，选择会记住（下次进来还是这个设置）
   ============================================================ */
var musicBtn = document.getElementById("musicBtn");
var nowEl = document.getElementById("nowPlaying");
var audioEl = null, audioSrc = "", probed = false;
var ac = null, musicGain = null, synthTimer = null, nextNoteTime = 0, stepIdx = 0;
var musicPlaying = false;
var musicWanted = (function(){ try { return localStorage.getItem("roseMusic") !== "off"; } catch(e){ return true; } })();

function nowShow(text){
  nowEl.textContent = text;
  nowEl.classList.add("show");
  clearTimeout(nowShow._t);
  nowShow._t = setTimeout(function(){ nowEl.classList.remove("show"); }, 5200);
}

/* —— 同时探测多个音源，谁先能用就用谁（github.io 在国内经常龟速，jsDelivr 快得多） —— */
var probeEls = [];
function probeOnce(src){
  return new Promise(function(res){
    var a = new Audio(), done = false;
    probeEls.push(a);
    function finish(v){ if (done) return; done = true; res({ src: v, el: a }); }
    a.preload = "metadata";
    a.addEventListener("loadedmetadata", function(){ finish(src); });
    a.addEventListener("canplay", function(){ finish(src); });
    a.addEventListener("error", function(){ finish(""); });
    setTimeout(function(){ finish(""); }, 7000);
    a.src = src;
  });
}
function killProbes(except){
  for (var i = 0; i < probeEls.length; i++){
    if (probeEls[i] === except) continue;
    try { probeEls[i].src = ""; } catch(e){}
  }
  probeEls = except ? [except] : [];
}
function findMusic(){
  var list = CONFIG.musicSources || [];
  for (var i = 0; i < list.length; i++){
    (function(src, delay){
      setTimeout(function(){
        if (audioSrc) return;                   /* 已经有能用的了，不用再试 */
        probeOnce(src).then(function(r){
          if (r.src){
            if (!audioSrc) audioSrc = r.src;    /* 首个可用的胜出 */
            killProbes(r.el);                   /* 其余的探测掐掉，别占带宽 */
          }
        });
      }, delay);
    })(list[i], i === 0 ? 0 : 2500 + (i - 1) * 1500);
  }
}

/* —— 内置小夜曲（现场合成，一个音符都不下载） —— */
var CHORDS = [[53,57,60,65],[55,59,62,67],[52,55,59,64],[57,60,64,69],
              [53,57,60,65],[55,59,62,67],[48,52,55,60],[55,59,62,67]];
var MELODY = [[69,72],[71,74],[67,71],[69,76],[65,69],[67,74],[72,76],[71,74]];
var ARP = [0,2,1,3,0,3,1,2], BPM = 66, STEPS = 8;

function midi(m){ return 440 * Math.pow(2, (m - 69) / 12); }
function ensureAudio(){
  if (ac) return;
  var AC = window.AudioContext || window.webkitAudioContext;
  if (!AC) return;
  ac = new AC();
  musicGain = ac.createGain(); musicGain.gain.value = 0.0001;
  var lp = ac.createBiquadFilter(); lp.type = "lowpass"; lp.frequency.value = 2400;
  var dl = ac.createDelay(1.0); dl.delayTime.value = 0.30;
  var fb = ac.createGain(); fb.gain.value = 0.24;
  var wet = ac.createGain(); wet.gain.value = 0.3;
  musicGain.connect(lp); lp.connect(ac.destination);
  lp.connect(dl); dl.connect(fb); fb.connect(dl); dl.connect(wet); wet.connect(ac.destination);
}
function tone(freq, t, dur, vol, type){
  var o = ac.createOscillator(), g = ac.createGain();
  o.type = type || "triangle"; o.frequency.value = freq;
  g.gain.setValueAtTime(0.0001, t);
  g.gain.linearRampToValueAtTime(vol, t + 0.014);
  g.gain.exponentialRampToValueAtTime(0.0008, t + dur);
  o.connect(g); g.connect(musicGain);
  o.start(t); o.stop(t + dur + 0.06);
}
function scheduleStep(step, t){
  var bar = Math.floor(step / STEPS) % CHORDS.length, k = step % STEPS, ch = CHORDS[bar];
  if (k === 0) tone(midi(ch[0] - 12), t, 1.6, 0.30, "sine");                  /* 低音 */
  tone(midi(ch[ARP[k]] + (k % 4 === 2 ? 12 : 0)), t, 1.05, 0.13, "triangle"); /* 琶音 */
  if (k === 0 || k === 4) tone(midi(MELODY[bar][k === 0 ? 0 : 1] + 12), t + 0.02, 1.7, 0.055, "sine"); /* 远处小铃 */
}
function synthStart(){
  ensureAudio(); if (!ac) return;
  if (ac.state === "suspended") ac.resume();
  stepIdx = 0; nextNoteTime = ac.currentTime + 0.12;
  if (synthTimer) clearInterval(synthTimer);
  synthTimer = setInterval(function(){
    if (!ac) return;
    var stepDur = 60 / BPM / 2;
    while (nextNoteTime < ac.currentTime + 0.3){
      scheduleStep(stepIdx, nextNoteTime);
      nextNoteTime += stepDur; stepIdx++;
    }
  }, 60);
}
function synthStop(){ if (synthTimer){ clearInterval(synthTimer); synthTimer = null; } }

function fadeAudio(to, ms){
  if (!audioEl) return;
  var from = audioEl.volume, t0 = Date.now();
  clearInterval(fadeAudio._t);
  fadeAudio._t = setInterval(function(){
    var k = Math.min(1, (Date.now() - t0) / ms);
    audioEl.volume = clamp(from + (to - from) * k, 0, 1);
    if (k >= 1) clearInterval(fadeAudio._t);
  }, 40);
}

function playMusic(){
  if (musicPlaying) return;
  if (!CONFIG.lullabyFallback && !(CONFIG.musicSources || []).length) return;
  musicPlaying = true;
  musicBtn.classList.add("on");
  musicBtn.title = "点一下，关掉音乐";
  musicBtn.setAttribute("aria-label", "关闭背景音乐");
  if (musicSources().length){
    if (!ensureAudioEl()) return;
    audioEl.volume = 0;
    var pr = audioEl.play();                    /* 关掉再打开＝接着上次听，不是从头 */
    if (pr && pr.catch) pr.catch(function(){
      /* 被浏览器拦下或音源没就绪：保持开启状态，等下一次点击再试 */
      setTimeout(function(){ if (musicPlaying && audioEl) audioEl.play().catch(function(){}); }, 600);
    });
    fadeAudio(CONFIG.musicVolume, 1800);
    nowShow("♪ " + CONFIG.musicTitle + "　·　点右上角 ♪ 可关掉");
  } else {
    ensureAudio();
    if (!ac){ musicPlaying = false; musicBtn.classList.remove("on"); return; }
    synthStart();
    musicGain.gain.cancelScheduledValues(ac.currentTime);
    musicGain.gain.setValueAtTime(0.0001, ac.currentTime);
    musicGain.gain.linearRampToValueAtTime(CONFIG.musicVolume, ac.currentTime + 2.2);
    nowShow("♪ " + CONFIG.lullabyTitle + "　·　点右上角 ♪ 可关掉");
  }
}
/* 音源列表：探测出来的排第一，其余依次兜底 */
function musicSources(){
  var all = (CONFIG.musicSources || []).slice();
  if (audioSrc){
    var i = all.indexOf(audioSrc);
    if (i > 0){ all.splice(i, 1); all.unshift(audioSrc); }
    else if (i < 0){ all.unshift(audioSrc); }
  }
  return all;
}
var srcTried = 0;
function ensureAudioEl(){
  var list = musicSources();
  if (!audioEl){
    if (!list.length) return false;
    srcTried = 0;
    audioEl = new Audio();
    audioEl.loop = true;                        /* 无限循环 */
    audioEl.preload = "auto";
    /* 双保险：万一某些浏览器忽略 loop，播完自己从头再来 */
    audioEl.addEventListener("ended", function(){
      try { audioEl.currentTime = 0; audioEl.play(); } catch(e){}
    });
    /* 这个源不通就换下一个 */
    audioEl.addEventListener("error", function(){
      srcTried++;
      var l = musicSources();
      if (srcTried < l.length){
        audioEl.src = l[srcTried];
        audioEl.load();
        if (musicPlaying){ var p = audioEl.play(); if (p && p.catch) p.catch(function(){}); }
      } else {
        musicPlaying = false;
        musicBtn.classList.remove("on");
        nowShow("音乐暂时加载不出来，过会儿再点一下 ♪");
      }
    });
    audioEl.src = list[0];
  }
  return true;
}
function stopMusic(){
  if (!musicPlaying) return;
  musicPlaying = false;
  musicBtn.classList.remove("on");
  musicBtn.title = "点一下，放首歌";
  musicBtn.setAttribute("aria-label", "播放背景音乐");
  if (audioEl){
    fadeAudio(0, 700);
    setTimeout(function(){ if (!musicPlaying && audioEl) audioEl.pause(); }, 760);
  } else if (ac && musicGain){
    musicGain.gain.cancelScheduledValues(ac.currentTime);
    musicGain.gain.setValueAtTime(musicGain.gain.value, ac.currentTime);
    musicGain.gain.linearRampToValueAtTime(0.0001, ac.currentTime + 0.7);
    setTimeout(function(){ if (!musicPlaying) synthStop(); }, 780);
  }
}
function rememberMusic(v){ musicWanted = v; try { localStorage.setItem("roseMusic", v ? "on" : "off"); } catch(e){} }

musicBtn.addEventListener("click", function(e){
  e.stopPropagation();
  if (musicPlaying){ rememberMusic(false); stopMusic(); }
  else { rememberMusic(true); playMusic(); }
});

/* 第一次碰屏幕 → 开始播放（把被浏览器拦下的自动播放补上） */
var unlocked = false;
function unlockMusic(e){
  if (e && e.target && e.target.closest && e.target.closest("#musicBtn")) return;
  if (unlocked) return;
  unlocked = true;
  if (musicWanted && !musicPlaying) playMusic();
}
window.addEventListener("pointerdown", unlockMusic, true);
window.addEventListener("keydown", unlockMusic, true);

/* 切走时安静，回来继续 */
document.addEventListener("visibilitychange", function(){
  if (!musicPlaying) return;
  if (document.hidden){
    if (audioEl) audioEl.pause();
    if (ac && ac.state === "running") ac.suspend();
  } else {
    if (audioEl){ var p = audioEl.play(); if (p && p.catch) p.catch(function(){}); }
    if (ac && ac.state === "suspended") ac.resume();
  }
});

window.__music = {
  playing: function(){ return musicPlaying; },
  source: function(){ return (audioEl && audioEl.src) ? audioEl.src : (audioSrc || "none"); },
  best: function(){ return audioSrc || "none"; },
  ctx: function(){ return ac ? ac.state : "none"; },
  gain: function(){ return musicGain ? +musicGain.gain.value.toFixed(3) : 0; },
  steps: function(){ return stepIdx; },
  wanted: function(){ return musicWanted; },
  loop: function(){ return audioEl ? audioEl.loop : null; },
  t: function(){ return audioEl ? +audioEl.currentTime.toFixed(2) : -1; },
  dur: function(){ return audioEl && isFinite(audioEl.duration) ? +audioEl.duration.toFixed(2) : -1; },
  paused: function(){ return audioEl ? audioEl.paused : null; },
  seek: function(v){ if (audioEl) audioEl.currentTime = v; }
};

findMusic();

/* ============================================================
   启动
   ============================================================ */
document.getElementById("capLine").textContent = CONFIG.caption;
document.getElementById("capSign").textContent = CONFIG.signature;
resize();
/* 💗 与信同步的「在一起」计时 + 自动烟花 + 整点烟花 */
pageStart = performance.now();
initTogether();
setInterval(function(){ launchFirework(); }, CONFIG.fireworkEveryMs);
var lastHour = new Date().getHours();
setInterval(function(){
  var h = new Date().getHours();
  if (h !== lastHour){
    lastHour = h;
    for (var i = 0; i < 3; i++) setTimeout(launchFirework, i * 420);  /* 整点放三束 */
  }
}, 20000);

setPhase("name", true);
requestAnimationFrame(frame);
setTimeout(function(){ hint.classList.add("show"); }, 2600);
setTimeout(function(){ hint.classList.remove("show"); }, 9000);

})();
</script>
</body>
</html>
