<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>元宵 · 企鹅桌宠 🐧</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%F0%9F%90%A7%3C/text%3E%3C/svg%3E">
<style>
/* ============================================================
   🐧 元宵 · 企鹅桌宠  v2.0
   · 纯 CSS 绘制 + 3D 透视光影（圆滚滚立体感）
   · 11 款皮肤 · 4 套造型 · 投喂变圆 · 摸头杀 · 作息生物钟
   · Web Audio 合成奶萌音效 + 系统语音说话
   · 头顶信息牌：时钟 / 倒计时 / 亲密度 / 陪伴时长
   ============================================================ */

/* ---------- 基础 ---------- */
*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%;overflow:hidden}
body{
  font-family:"PingFang SC","Microsoft YaHei","Hiragino Sans GB",sans-serif;
  user-select:none;-webkit-user-select:none;
  background:linear-gradient(180deg,#cfe9ff 0%,#e9f5ff 42%,#eefaf1 60%,#dcf2e4 100%);
}
body.electron{background:transparent}
#floor{
  position:fixed;left:0;right:0;bottom:0;height:12vh;
  background:linear-gradient(180deg,rgba(255,255,255,0),rgba(150,205,175,.32));
  border-top:1px dashed rgba(120,180,150,.35);
}
body.electron #floor{display:none}
#hint{
  position:fixed;left:14px;bottom:12px;font-size:12px;color:#6c8b96;
  background:rgba(255,255,255,.55);padding:5px 11px;border-radius:999px;
  backdrop-filter:blur(3px);pointer-events:none;
}
body.electron #hint{display:none}

/* ============================================================
   🐧 企鹅本体（3D 透视）
   ============================================================ */
#pet{
  position:fixed;left:0;top:0;width:96px;height:118px;
  cursor:grab;touch-action:none;z-index:10;
  perspective:520px;
  --body:#2c3138; --body2:#171b21; --body-hi:#4a525c;
  --belly:#ffffff; --facec:#ffffff;
  --cheek:#ff8fb0; --cheek-op:.35;
  --beak:#ffb340; --foot:#ffb340;
  --ex:0px; --ey:0px; --tilt:0deg;
  --ry:0deg; --rx:0deg;
  --gx:0px; --gy:0px;
  --grow:1;
}
#pet.dragging{cursor:grabbing}

.flip{position:relative;width:100%;height:100%;transition:transform .18s ease}
#pet.facing-left .flip{transform:scaleX(-1)}

.pet-inner{position:relative;width:100%;height:100%;transform-origin:50% 90%;transition:transform .3s ease}
.stage3d{
  position:relative;width:100%;height:100%;
  transform-style:preserve-3d;
  transform:rotateY(var(--ry)) rotateX(var(--rx));
  transition:transform .25s ease-out;
}
.penguin{
  position:relative;width:100%;height:100%;
  transform-style:preserve-3d;
  transform:scale(var(--grow));
  animation:breathe 2.2s ease-in-out infinite;
}
@keyframes breathe{0%,100%{transform:scale(var(--grow))}50%{transform:translateY(-2.5px) scale(calc(var(--grow) * 1.015), calc(var(--grow) * .985))}}

.shadow{position:absolute;left:50%;bottom:-5px;width:74px;height:13px;margin-left:-37px;
  border-radius:50%;background:rgba(50,80,70,.24);filter:blur(4px);transition:all .3s ease}

.foot{position:absolute;bottom:1px;width:25px;height:12px;z-index:2;
  border-radius:60% 60% 50% 50% / 70% 70% 30% 30%;
  background:radial-gradient(120% 140% at 40% 20%,#ffd08a,var(--foot) 55%,#d98b12 100%);
  box-shadow:0 2px 3px rgba(120,80,0,.25), inset 0 -2px 2px rgba(150,90,0,.25);
  transition:transform .2s}
.foot-l{left:12px}
.foot-r{right:12px}

.body{position:absolute;left:8px;bottom:7px;width:80px;height:74px;z-index:3;
  border-radius:50% 50% 46% 46% / 58% 58% 42% 42%;
  background:radial-gradient(120% 120% at 32% 18%, var(--body-hi) 0%, var(--body) 46%, var(--body2) 100%);
  box-shadow:
    inset -8px -10px 18px rgba(0,0,0,.35),
    inset 6px 6px 14px rgba(255,255,255,.10),
    0 6px 12px rgba(20,40,60,.18);
}
.belly{position:absolute;left:14px;top:15px;width:52px;height:53px;
  border-radius:50% 50% 48% 48% / 54% 54% 46% 46%;
  background:radial-gradient(120% 120% at 38% 20%, #ffffff 40%, var(--belly) 100%);
  box-shadow:inset 0 -4px 8px rgba(0,0,0,.07), inset 0 3px 6px rgba(255,255,255,.9), 0 -2px 6px rgba(255,255,255,.35);
}

.wing{position:absolute;top:50px;width:20px;height:43px;z-index:4;
  border-radius:60% 60% 50% 50% / 70% 70% 30% 30%;
  background:linear-gradient(160deg, var(--body-hi) 0%, var(--body) 45%, var(--body2) 100%);
  transform-origin:50% 8%;
  box-shadow:inset -3px -4px 8px rgba(0,0,0,.35), 2px 3px 6px rgba(20,40,60,.18);
  transition:transform .25s ease;
}
.wing-l{left:-2px;transform:rotate(7deg)}
.wing-r{right:-2px;transform:rotate(-7deg)}

.head{position:absolute;left:10px;top:0;width:76px;height:70px;z-index:5;
  border-radius:50% 50% 46% 46% / 52% 52% 48% 48%;
  background:radial-gradient(120% 120% at 34% 20%, var(--body-hi) 0%, var(--body) 46%, var(--body2) 100%);
  box-shadow:
    inset -7px -9px 16px rgba(0,0,0,.35),
    inset 5px 5px 12px rgba(255,255,255,.10),
    0 4px 10px rgba(20,40,60,.16);
  transform:rotate(var(--tilt)) rotateX(var(--headx,0deg));
  transform-origin:50% 86%;
  transition:transform .35s ease;
  transform-style:preserve-3d;
}

.face{position:absolute;left:9px;top:12px;width:58px;height:52px;border-radius:50%;
  background:radial-gradient(120% 120% at 40% 20%, #ffffff 55%, var(--facec) 100%);
  box-shadow:inset 0 -5px 8px rgba(0,0,0,.07), 0 2px 5px rgba(0,0,0,.06);
  transform-origin:50% 100%;transition:transform .3s ease;
}

.eye{position:absolute;top:16px;width:13px;height:15px;border-radius:50%;
  background:radial-gradient(120% 120% at 35% 30%, #4a5160 0%, #23262e 55%, #0d0f14 100%);
  overflow:hidden;
  box-shadow:inset 0 -1px 2px rgba(255,255,255,.35), 0 1px 2px rgba(0,0,0,.25);
  transform:translate(var(--ex),var(--ey));transition:transform .18s ease-out}
.eye-l{left:10px}
.eye-r{right:10px}
.eye .glint{position:absolute;left:3px;top:2px;width:5px;height:5px;border-radius:50%;
  background:#fff;opacity:.98;box-shadow:0 0 3px rgba(255,255,255,.9)}
.eye .glint.g2{left:9px;top:9px;width:2.5px;height:2.5px;opacity:.6}
.lid{position:absolute;inset:0;background:var(--facec);border-bottom:2px solid #262a33;
  border-radius:50%;transform:scaleY(0);transform-origin:top center;transition:transform .16s ease}

.blush{position:absolute;top:31px;width:14px;height:9px;border-radius:50%;
  background:radial-gradient(circle, var(--cheek) 0%, rgba(255,255,255,0) 72%);
  opacity:var(--cheek-op);transition:opacity .4s}
.blush-l{left:2px}
.blush-r{right:2px}

.beak{position:absolute;left:50%;top:29px;width:16px;height:12px;margin-left:-8px;
  background:radial-gradient(120% 120% at 35% 20%, #ffd98a, var(--beak) 55%, #d98b12 100%);
  border-radius:50% 50% 50% 50% / 34% 34% 92% 92%;
  box-shadow:0 2px 3px rgba(150,90,0,.3), inset 0 -1px 2px rgba(255,255,255,.5);
  transition:transform .15s}

/* 立体高光：只打在肚子/身体上，且压在头下面一层，绝不会挡脸 */
.gloss{position:absolute;left:30px;top:68px;width:30px;height:18px;border-radius:50%;
  background:radial-gradient(circle at 42% 35%, rgba(255,255,255,.55), rgba(255,255,255,0) 70%);
  transform:translate(var(--gx),var(--gy));pointer-events:none;z-index:4;filter:blur(2px);opacity:.85}

/* ============================================================
   🎒 造型配件
   ============================================================ */
.scarf{display:none;position:absolute;left:13px;top:63px;width:70px;height:14px;z-index:6;
  border-radius:8px;background:linear-gradient(180deg,var(--scarf1,#6aa8ff),var(--scarf2,#3f7fe0));
  box-shadow:inset 0 -2px 3px rgba(0,0,0,.16)}
.scarf i{position:absolute;right:7px;top:9px;width:14px;height:26px;border-radius:6px;
  background:linear-gradient(180deg,var(--scarf1,#5b9bff),var(--scarf2,#3a76d6));transform:rotate(-7deg)}
#pet.skin-scarf .scarf,#pet.skin-aurora .scarf,#pet.skin-christmas .scarf,#pet.skin-newyear .scarf{display:block}

.bow{display:none;position:absolute;left:50%;top:95px;width:34px;height:16px;margin-left:-17px;z-index:7}
.bow::before,.bow::after{content:"";position:absolute;top:0;width:15px;height:16px;
  border-radius:60% 40% 60% 40%;background:linear-gradient(180deg,#ffa8cb,#ef5f9c)}
.bow::before{left:0;transform:rotate(-8deg)}
.bow::after{right:0;transform:rotate(8deg)}
.bow i{position:absolute;left:50%;top:3px;width:9px;height:10px;margin-left:-4.5px;z-index:2;
  border-radius:50%;background:linear-gradient(180deg,#ffc2da,#e8488a)}
#pet.skin-sakura .bow{display:block}

.flower-top{display:none;position:absolute;left:50%;top:-10px;margin-left:-8px;width:16px;height:16px;z-index:8}
.flower-top::before{content:"❀";position:absolute;left:0;top:-2px;font-size:16px;color:#ff9ec4;
  text-shadow:0 1px 3px rgba(255,120,170,.5)}
#pet.skin-sakura .flower-top{display:block}

.hat{display:none;position:absolute;left:50%;top:-10px;width:40px;height:22px;margin-left:-20px;z-index:8}
.hat::before{content:"";position:absolute;left:0;bottom:0;width:40px;height:6px;border-radius:6px;background:#e59a33}
.hat::after{content:"";position:absolute;left:8px;bottom:4px;width:24px;height:15px;
  border-radius:12px 12px 4px 4px;background:linear-gradient(180deg,#ffd489,#f0a53a);
  box-shadow:inset 0 -2px 3px rgba(0,0,0,.12)}
#pet.skin-sunny .hat{display:block}

.santa{display:none;position:absolute;left:50%;top:-16px;width:46px;height:28px;margin-left:-23px;z-index:9}
.santa::before{content:"";position:absolute;left:7px;bottom:6px;width:32px;height:22px;
  border-radius:50% 50% 18% 18% / 72% 72% 28% 28%;
  background:linear-gradient(180deg,#e8433f,#b71c1c);transform:rotate(-10deg)}
.santa::after{content:"";position:absolute;left:0;bottom:0;width:46px;height:9px;border-radius:7px;
  background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.12)}
.santa i{position:absolute;right:-3px;top:-8px;width:13px;height:13px;border-radius:50%;background:#fff;
  box-shadow:0 1px 3px rgba(0,0,0,.15)}
#pet.skin-christmas .santa{display:block}

.crown{display:none;position:absolute;left:50%;top:-13px;width:38px;height:20px;margin-left:-19px;z-index:9}
.crown::before{content:"";position:absolute;left:0;bottom:0;width:38px;height:7px;border-radius:4px;
  background:linear-gradient(180deg,#ffe08a,#dfa123)}
.crown::after{content:"";position:absolute;left:2px;bottom:6px;width:34px;height:13px;
  background:linear-gradient(180deg,#ffeaa8,#f0b53c);
  clip-path:polygon(0 100%,10% 0,27% 62%,50% 0,73% 62%,90% 0,100% 100%)}
#pet.skin-newyear .crown{display:block}

/* —— 造型：学霸款 —— */
.glasses{display:none;position:absolute;left:8px;top:24px;width:42px;height:16px;z-index:9}
.glasses::before,.glasses::after{content:"";position:absolute;top:0;width:14px;height:14px;
  border:2px solid #4a3b2a;border-radius:50%;background:rgba(200,225,245,.32);
  box-shadow:inset 0 0 4px rgba(255,255,255,.8)}
.glasses::before{left:0}
.glasses::after{right:0}
.glasses i{position:absolute;left:15px;top:6px;width:12px;height:2px;background:#4a3b2a}
#pet.outfit-study .glasses{display:block}
.bag{display:none;position:absolute;left:58px;top:44px;width:30px;height:36px;z-index:2;
  border-radius:8px 8px 10px 10px;background:linear-gradient(160deg,#f0a04b,#d97b22);
  box-shadow:inset -3px -3px 6px rgba(0,0,0,.2), 2px 3px 6px rgba(60,40,10,.25);
  transform:rotate(-8deg)}
.bag::before{content:"";position:absolute;left:5px;top:-6px;width:20px;height:10px;
  border:2px solid #c46a15;border-bottom:none;border-radius:10px 10px 0 0}
#pet.outfit-study .bag{display:block}

/* —— 造型：摸鱼款 —— */
.leaf{display:none;position:absolute;left:50%;top:-12px;margin-left:-9px;width:18px;height:12px;z-index:9;
  background:linear-gradient(140deg,#8ed07a,#3f8f4a);
  border-radius:0 100% 0 100%;transform:rotate(-18deg);
  box-shadow:0 1px 2px rgba(30,70,30,.3)}
#pet.outfit-lazy .leaf{display:block}
.grass{display:none;position:absolute;left:44px;top:38px;width:16px;height:3px;z-index:9;
  background:linear-gradient(90deg,#8ed07a,#3f8f4a);border-radius:2px;transform:rotate(-12deg)}
#pet.outfit-lazy .grass{display:block}

/* —— 造型：节日款 —— */
.redflower{display:none;position:absolute;left:50%;top:-13px;margin-left:-10px;width:20px;height:20px;z-index:9}
.redflower::before{content:"";position:absolute;left:2px;top:2px;width:16px;height:16px;border-radius:50%;
  background:radial-gradient(circle at 35% 30%, #ff8b8b, #d32f2f 70%);
  box-shadow:0 0 0 3px rgba(255,255,255,.55), 0 2px 4px rgba(150,0,0,.35)}
.redflower i{position:absolute;left:8px;top:7px;width:6px;height:6px;border-radius:50%;background:#ffe082}
#pet.outfit-festival .redflower{display:block}

/* ============================================================
   🎨 11 款皮肤（必须 #pet.xxx，否则会被 #pet 默认变量覆盖）
   ============================================================ */
#pet.skin-classic{--body:#2c3138;--body2:#171b21;--body-hi:#4a525c;--belly:#ffffff;--facec:#ffffff;
  --cheek:#ff8fb0;--cheek-op:.35;--beak:#ffb340;--foot:#ffb340}
#pet.skin-blush{--body:#3a2b34;--body2:#241820;--body-hi:#5a4450;--belly:#fff4f8;--facec:#fff9fb;
  --cheek:#ff5f95;--cheek-op:.85;--beak:#ffa9bf;--foot:#ffa8bd}
#pet.skin-scarf{--body:#2c3138;--body2:#171b21;--body-hi:#4a525c;--belly:#ffffff;--facec:#ffffff;
  --cheek:#ff8fb0;--cheek-op:.42;--beak:#ffb340;--foot:#ffb340}
#pet.skin-sakura{--body:#4a3340;--body2:#2e1f27;--body-hi:#6d4a58;--belly:#fff2f7;--facec:#fff7fa;
  --cheek:#ff6fa5;--cheek-op:.8;--beak:#ff9fbb;--foot:#ff9fbb}
#pet.skin-aurora{--body:#26364f;--body2:#141f30;--body-hi:#44618a;--belly:#eef6ff;--facec:#f6fbff;
  --cheek:#7fb6ff;--cheek-op:.6;--beak:#8fd0ff;--foot:#8fd0ff;--scarf1:#8fd3ff;--scarf2:#4a7fd6}
#pet.skin-sunny{--body:#4a3a2c;--body2:#2c2119;--body-hi:#6f5540;--belly:#fff6e8;--facec:#fffaef;
  --cheek:#ffab5e;--cheek-op:.7;--beak:#ffb43c;--foot:#ffb43c}
#pet.skin-rose{--body:#e8629b;--body2:#c33d76;--body-hi:#ff9dc4;--belly:#fff5f9;--facec:#fffafc;
  --cheek:#ff2e74;--cheek-op:.7;--beak:#ff9ec4;--foot:#ff9ec4}
#pet.skin-peach{--body:#f0937f;--body2:#cf6a58;--body-hi:#ffbda9;--belly:#fff7f2;--facec:#fffaf6;
  --cheek:#ff7f6b;--cheek-op:.65;--beak:#ffb27a;--foot:#ffb27a}
#pet.skin-cotton{--body:#e9a6d8;--body2:#c274b4;--body-hi:#ffc9ef;--belly:#fdf5ff;--facec:#fffafe;
  --cheek:#ff86cf;--cheek-op:.75;--beak:#ffb0e0;--foot:#ffb0e0}
#pet.skin-christmas{--body:#8c2326;--body2:#541214;--body-hi:#b83b3d;--belly:#fff5f5;--facec:#fffafa;
  --cheek:#ff6b6b;--cheek-op:.7;--beak:#ffb340;--foot:#ffb340;--scarf1:#9cdb8e;--scarf2:#418f4a}
#pet.skin-newyear{--body:#6d1f33;--body2:#3f1120;--body-hi:#9c3350;--belly:#fff4e4;--facec:#fffbf2;
  --cheek:#ffb347;--cheek-op:.75;--beak:#ffd05c;--foot:#ffd05c;--scarf1:#ffdd85;--scarf2:#d99a20}

/* ============================================================
   😊 情绪
   ============================================================ */
#pet.mood-happy{--cheek-op:.75}
#pet.mood-happy .eye{background:transparent;height:9px;border-radius:50% 50% 0 0;
  border-top:3px solid #23262e;box-shadow:none}
#pet.mood-happy .eye .glint{display:none}
#pet.mood-happy .lid{display:none}
#pet.mood-happy .penguin{animation:breathe-happy 1.5s ease-in-out infinite}
@keyframes breathe-happy{0%,100%{transform:scale(var(--grow))}50%{transform:translateY(-3.5px) scale(calc(var(--grow) * 1.02), calc(var(--grow) * .98))}}

#pet.mood-curious .pet-inner{transform:rotate(-4deg)}
#pet.mood-curious .eye{width:14px;height:17px;top:14px}
#pet.mood-curious .head{--headx:2deg}
#pet.mood-curious{--cheek-op:.6}
#pet.mood-curious .penguin{animation:breathe 1.9s ease-in-out infinite}

#pet.mood-bored .pet-inner{transform:rotate(3.5deg)}
#pet.mood-bored .lid{transform:scaleY(.45)}
#pet.mood-bored .eye{opacity:.85}
#pet.mood-bored .face{transform:translateX(2px)}
#pet.mood-bored .penguin{animation:breathe-slow 4.2s ease-in-out infinite}
@keyframes breathe-slow{0%,100%{transform:scale(var(--grow))}50%{transform:translateY(-1.5px) scale(calc(var(--grow) * 1.008), calc(var(--grow) * .992))}}

#pet.mood-sleepy .lid{transform:scaleY(.84)}
#pet.mood-sleepy .eye{transform:translate(var(--ex),1.5px)}
#pet.mood-sleepy .face{animation:nod 4.4s ease-in-out infinite}
@keyframes nod{0%,58%,100%{transform:translateY(0) rotate(0)}70%{transform:translateY(3px) rotate(5deg)}82%{transform:translateY(0) rotate(0)}}
#pet.mood-sleepy .penguin{animation:breathe-slow 4.6s ease-in-out infinite}

/* ============================================================
   🎬 动作状态
   ============================================================ */
#pet.near-mouse{--cheek-op:.95}
#pet.badge-on .badge{opacity:1}

.walking .penguin{animation:walk-bob .46s ease-in-out infinite}
@keyframes walk-bob{0%,100%{transform:scale(var(--grow)) rotate(-1.2deg)}50%{transform:translateY(-3px) scale(var(--grow)) rotate(1.2deg)}}
.walking .foot-l{animation:step-l .46s ease-in-out infinite}
.walking .foot-r{animation:step-r .46s ease-in-out infinite}
@keyframes step-l{0%,100%{transform:translateY(0) rotate(0)}50%{transform:translateY(-4px) rotate(-10deg)}}
@keyframes step-r{0%,100%{transform:translateY(-4px) rotate(10deg)}50%{transform:translateY(0) rotate(0)}}
.walking .wing-l{animation:swing-l .46s ease-in-out infinite}
.walking .wing-r{animation:swing-r .46s ease-in-out infinite}
@keyframes swing-l{0%,100%{transform:rotate(7deg)}50%{transform:rotate(20deg)}}
@keyframes swing-r{0%,100%{transform:rotate(-7deg)}50%{transform:rotate(-20deg)}}

.blink .lid{transform:scaleY(1) !important;transition:transform .09s ease}

.squish .pet-inner{animation:squish .22s ease}
@keyframes squish{0%{transform:scale(1,1)}45%{transform:scale(1.1,.86) translateY(3px)}100%{transform:scale(1,1)}}
.flap .wing-l{animation:flap-l .2s ease-in-out 4}
.flap .wing-r{animation:flap-r .2s ease-in-out 4}
@keyframes flap-l{0%,100%{transform:rotate(7deg)}50%{transform:rotate(58deg)}}
@keyframes flap-r{0%,100%{transform:rotate(-7deg)}50%{transform:rotate(-58deg)}}
.flap .penguin{animation:hop .26s ease-in-out 2}
@keyframes hop{0%,100%{transform:scale(var(--grow))}50%{transform:translateY(-7px) scale(var(--grow))}}

.dragging .pet-inner{transform:rotate(var(--drag-tilt,0deg))}
.wobble .pet-inner{animation:wobble .85s ease-in-out}
@keyframes wobble{0%{transform:rotate(0)}18%{transform:rotate(-8deg)}38%{transform:rotate(7deg)}58%{transform:rotate(-4deg)}78%{transform:rotate(2deg)}100%{transform:rotate(0)}}

/* 双击盲盒动作 */
.dbl-jump .pet-inner{animation:dbl-jump .9s ease}
@keyframes dbl-jump{
  0%{transform:translateY(0)}25%{transform:translateY(-42px) rotate(-5deg)}
  45%{transform:translateY(-30px) rotate(5deg)}65%{transform:translateY(-16px) rotate(-4deg)}
  85%{transform:translateY(-4px) rotate(2deg)}100%{transform:translateY(0) rotate(0)}
}
.dbl-spin .stage3d{animation:dbl-spin 1.05s cubic-bezier(.35,.05,.3,1)}
@keyframes dbl-spin{
  0%{transform:rotateY(0deg) rotateX(0deg) scale(1)}
  50%{transform:rotateY(180deg) rotateX(6deg) scale(1.06)}
  100%{transform:rotateY(360deg) rotateX(0deg) scale(1)}

/* ============================================================
   🔊 奶萌音效（Web Audio 代码合成，不需要任何音频文件）
   ============================================================ */
var Sfx = (function(){
  var ctx = null, level = 2;   /* 0 静音 1 小 2 中 3 大 */
  function ready(){
    try{
      if (!ctx) ctx = new (window.AudioContext || window.webkitAudioContext)();
      if (ctx.state === "suspended") ctx.resume();
      return ctx;
    }catch(e){ return null; }
  }
  function vol(){ return [0, .05, .12, .22][level] || .12; }
  function tone(freq, dur, type, delay, glideTo, vibrato){
    var c = ready(); if (!c || level === 0) return;
    var t0 = c.currentTime + (delay || 0);
    var osc = c.createOscillator(), g = c.createGain();
    osc.type = type || "sine";
    osc.frequency.setValueAtTime(freq, t0);
    if (glideTo) osc.frequency.exponentialRampToValueAtTime(glideTo, t0 + dur);
    if (vibrato){
      var lfo = c.createOscillator(), lg = c.createGain();
      lfo.frequency.value = 18; lg.gain.value = vibrato;
      lfo.connect(lg); lg.connect(osc.frequency); lfo.start(t0); lfo.stop(t0 + dur);
    }
    var v = vol();
    g.gain.setValueAtTime(0.0001, t0);
    g.gain.exponentialRampToValueAtTime(v, t0 + Math.min(.04, dur / 3));
    g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
    osc.connect(g); g.connect(c.destination);
    osc.start(t0); osc.stop(t0 + dur + .02);
  }
  function noise(dur, delay){
    var c = ready(); if (!c || level === 0) return;
    var t0 = c.currentTime + (delay || 0);
    var len = Math.max(1, Math.floor(c.sampleRate * dur));
    var buf = c.createBuffer(1, len, c.sampleRate);
    var d = buf.getChannelData(0);
    for (var i = 0; i < len; i++) d[i] = (Math.random() * 2 - 1) * (1 - i / len);
    var src = c.createBufferSource(); src.buffer = buf;
    var f = c.createBiquadFilter(); f.type = "lowpass"; f.frequency.value = 700;
    var g = c.createGain(); g.gain.value = vol() * 1.4;
    src.connect(f); f.connect(g); g.connect(c.destination);
    src.start(t0);
  }
  return {
    setLevel: function(l){ level = Math.max(0, Math.min(3, l)); },
    getLevel: function(){ return level; },
    levelName: function(){ return ["静音","小声","中声","大声"][level]; },
    chirp: function(){ tone(880, .13, "sine", 0, 1500); },                       /* 叽～ */
    squeak: function(){ tone(1150, .12, "triangle", 0, 900, 40); tone(1250, .14, "triangle", .16, 980, 40); }, /* 嘤嘤～ */
    hum: function(){ tone(980, .18, "sine", 0, 1180, 25); tone(1040, .2, "sine", .2, 1240, 25); tone(1100, .22, "sine", .42, 1300, 25); },
    eat: function(){ tone(1000, .1, "square", 0, 1400); noise(.09, .12); noise(.09, .3); noise(.08, .48); },
    sleepyHum: function(){ tone(320, .42, "sine", 0, 240, 12); },               /* 嗯…？ */
    whine: function(){ tone(720, .38, "sine", 0, 380, 18); },                   /* 呜咽 */
    levelUp: function(){ tone(660, .12, "triangle", 0); tone(880, .12, "triangle", .14); tone(1180, .2, "triangle", .28); },
    bell: function(){ tone(1320, .16, "sine", 0, 1320); tone(1760, .22, "sine", .22, 1760); },
    idleChirp: function(){ tone(760, .1, "sine", 0, 1000, 20); }
  };
})();

/* ============================================================
   🗣 说话系统（三种方式，任选）
   🎵 animalese  卡通小奶音：Web Audio 现场合成的"咿咿呀呀"，像游戏角色，最奶
   🗣 tts        童声真人语音：调用 Windows 童声「瑶瑶」念中文（可调音高/语速）
   🔇 off        不说话，只保留啾啾叫声
   ============================================================ */
var VoiceCfg = { mode: "animalese", voice: "Yaoyao", pitch: 35, rate: 8 };
var ipcVoice = null;
try { if (/Electron/i.test(navigator.userAgent)) ipcVoice = require("electron").ipcRenderer; } catch(e){ ipcVoice = null; }

/* —— 卡通小奶音：每个字一个小音块（动森那种"咿咿呀呀"）—— */
var Animalese = (function(){
  var ctx = null;
  function ready(){
    try{
      if (!ctx) ctx = new (window.AudioContext || window.webkitAudioContext)();
      if (ctx.state === "suspended") ctx.resume();
      return ctx;
    }catch(e){ return null; }
  }
  /* 单个"咿呀"音块：正弦为主 + 轻泛音 + 低通柔化 = 软糯清脆 */
  function blip(c, t0, freq, dur, vol){
    var o1 = c.createOscillator(), o2 = c.createOscillator();
    var g = c.createGain(), g2 = c.createGain();
    var bp = c.createBiquadFilter(), lp = c.createBiquadFilter();
    o1.type = "sine"; o2.type = "triangle";
    o1.frequency.setValueAtTime(freq, t0);
    o1.frequency.linearRampToValueAtTime(freq * 1.10, t0 + dur);   /* 尾音轻轻上扬 */
    o2.frequency.setValueAtTime(freq * 1.5, t0);
    o2.frequency.linearRampToValueAtTime(freq * 1.6, t0 + dur);
    bp.type = "bandpass"; bp.frequency.value = 850 + Math.random() * 450; bp.Q.value = 1.0;
    lp.type = "lowpass"; lp.frequency.value = 3400;                 /* 削掉刺耳高频 → 更软 */
    g2.gain.value = 0.22;                                           /* 泛音很轻 → 不吵 */
    g.gain.setValueAtTime(0.0001, t0);
    g.gain.linearRampToValueAtTime(vol, t0 + 0.03);                 /* 软起音 */
    g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);          /* 自然收尾 */
    o1.connect(bp); o2.connect(g2); g2.connect(bp);
    bp.connect(lp); lp.connect(g); g.connect(c.destination);
    o1.start(t0); o1.stop(t0 + dur + 0.02);
    o2.start(t0); o2.stop(t0 + dur + 0.02);
  }
  return {
    speak: function(text, vol){
      var c = ready(); if (!c) return 0;
      var raw = String(text).replace(/<[^>]+>/g, "").slice(0, 90);
      if (!raw) return 0;
      /* 标点处停一下，念起来更像说话 */
      var gap = { "，": 0.10, "、": 0.08, "。": 0.22, "！": 0.22, "？": 0.22,
                  "~": 0.06, "～": 0.06, "…": 0.20, "；": 0.14, "：": 0.12 };
      var t = c.currentTime + 0.02, count = 0;
      var base = 480 + Math.random() * 40;       /* 每句音色略有不同，避免机械感 */
      for (var i = 0; i < raw.length && count < 46; i++){
        var ch = raw.charAt(i);
        if (/\s/.test(ch)){ t += 0.03; continue; }
        if (gap[ch] !== undefined){ t += gap[ch]; continue; }
        if (!/[\u4e00-\u9fa5a-zA-Z0-9]/.test(ch)) continue;
        var code = ch.charCodeAt(0);
        var freq = base + (code % 8) * 22 + (i % 3) * 9 + Math.random() * 14;
        var dur = 0.072 + (code % 3) * 0.012;
        blip(c, t, freq, dur, (vol || 0.13));    /* 音量偏轻，奶而不吵 */
        t += dur * 0.9;
        count++;
      }
      return (t - c.currentTime) * 1000;
    }
  };
})();

/* —— 说话总入口 —— */
var Speech = (function(){
  var ok = ("speechSynthesis" in window);
  function stopAll(){
    try { if (ok) window.speechSynthesis.cancel(); } catch(e){}
    if (ipcVoice) { try { ipcVoice.send("pet-speak-stop"); } catch(e){} }
  }
  function speak(text){
    var t = String(text || "").replace(/<[^>]+>/g, "").trim();
    if (!t || VoiceCfg.mode === "off") return;
    if (VoiceCfg.mode === "animalese"){ stopAll(); Animalese.speak(t); return; }
    /* 童声真人语音：优先走 Electron → Windows 童声 */
    if (ipcVoice){
      try { ipcVoice.send("pet-speak", { text: t, voice: VoiceCfg.voice, pitch: VoiceCfg.pitch, rate: VoiceCfg.rate }); return; } catch(e){}
    }
    if (!ok) return;
    try{
      window.speechSynthesis.cancel();
      var u = new SpeechSynthesisUtterance(t.replace(/[～~]/g, "，"));
      u.lang = "zh-CN";
      u.pitch = Math.min(2, 1 + VoiceCfg.pitch / 50);   /* 35 → 1.7 明显更奶 */
      u.rate = Math.max(0.6, 1 + VoiceCfg.rate / 40);
      window.speechSynthesis.speak(u);
    }catch(e){}
  }
  return {
    speak: speak,
    stop: stopAll,
    setMode: function(m){ VoiceCfg.mode = m; if (m === "off") stopAll(); },
    getMode: function(){ return VoiceCfg.mode; },
    toggle: function(){ VoiceCfg.mode = (VoiceCfg.mode === "off") ? "animalese" : "off"; if (VoiceCfg.mode === "off") stopAll(); return VoiceCfg.mode !== "off"; },
    isOn: function(){ return VoiceCfg.mode !== "off"; },
    available: true
  };
})();

}

var drag = { active: false, sx: 0, sy: 0, px: 0, py: 0, moved: 0, t: 0, lastX: 0 };

pet.addEventListener("pointerdown", function(e){
  if (e.button !== 0) return;
  closeMenu();
  drag.active = true; state.dragging = true; drag.moved = 0; drag.t = Date.now();
  drag.sx = e.clientX; drag.sy = e.clientY;
  drag.px = state.x; drag.py = state.y; drag.lastX = e.clientX;
  pet.classList.add("dragging");
  pet.style.transition = "none";
  try { pet.setPointerCapture(e.pointerId); } catch(err){}
  stopWalk();
  touchInteraction(false);
});
function dragMove(e){
  var dx = e.clientX - drag.sx, dy = e.clientY - drag.sy;
  drag.moved = Math.max(drag.moved, Math.abs(dx) + Math.abs(dy));
  state.x = clamp(drag.px + dx, -CONFIG.petW * 0.3, window.innerWidth - CONFIG.petW * 0.7);
  state.y = clamp(drag.py + dy, 10, window.innerHeight - CONFIG.petH * 0.6);
  var vx = e.clientX - drag.lastX; drag.lastX = e.clientX;
  pet.style.setProperty("--drag-tilt", clamp(vx * 1.6, -16, 16).toFixed(1) + "deg");
  if (Math.abs(dx) > 4){ state.facing = dx > 0 ? 1 : -1; applyFacing(); }
  render();
}
window.addEventListener("pointerup", function(){
  if (!drag.active) return;
  drag.active = false;
  state.dragging = false;
  pet.classList.remove("dragging");
  pet.style.removeProperty("--drag-tilt");
  pet.style.transition = "transform .35s cubic-bezier(.3,1.2,.5,1)";
  state.x = clamp(state.x, layout.xMin, layout.xMax);
  state.y = layout.yMax;

var items = Array.prototype.slice.call(menu.querySelectorAll(".item"));
var activeItems = items.filter(function(b){ return b.style.display !== "none"; });
function layoutMenuItems(){
  var r1 = menuRadius(), r2 = menuRadius() + 50;
  var ring1 = activeItems.filter(function(b){ return b.classList.contains("ring1"); });
  var ring2 = activeItems.filter(function(b){ return b.classList.contains("ring2"); });
  function place(list, r, a0, a1){
    var n = list.length;
    list.forEach(function(btn, i){
      var deg = (n === 1) ? (a0 + a1) / 2 : (a0 + (a1 - a0) * i / (n - 1));
      var a = deg * Math.PI / 180;
      btn.style.left = (Math.cos(a) * r).toFixed(1) + "px";
      btn.style.top = (Math.sin(a) * r).toFixed(1) + "px";
    });
  }
  place(ring1, r1, -168, -12);
  place(ring2, r2, -188, 8);
}
function openMenu(){
  var c = petCenter();
  menu.style.left = c.x + "px";
  menu.style.top = (c.y - 4) + "px";
  layoutMenuItems();
  activeItems.forEach(function(btn, i){ btn.style.transitionDelay = (i * 40) + "ms"; });
  menu.classList.add("open");
  state.menuOpen = true;
  Sfx.chirp();
  touchInteraction(false);
}
function closeMenu(){
  if (!state.menuOpen) return;
  state.menuOpen = false;
  menu.classList.remove("open");
  items.forEach(function(btn){ btn.style.transitionDelay = "0ms"; });
}
pet.addEventListener("contextmenu", function(e){
  e.preventDefault(); e.stopPropagation();
  state.menuOpen ? closeMenu() : openMenu();

document.addEventListener("pointerdown", function(e){
  if (state.menuOpen && !e.target.closest("#menu") && !e.target.closest("#pet")) closeMenu();
  if (e.target.closest && !e.target.closest(".panel") && !e.target.closest("#menu")) closePanels();
});

menu.addEventListener("click", function(e){

  var act = btn.getAttribute("data-act");
  closeMenu();
  if (act === "feed")   actionFeed();
  if (act === "pat")    actionPat();

var voiceBackup = null;
function loadVoiceList(){
  var sel = $("voicePick");
  if (sel.options.length > 0) return;
  function fill(names){
    sel.innerHTML = "";
    names.forEach(function(it){
      var o = document.createElement("option");
      o.value = it.voice; o.textContent = it.label;
      sel.appendChild(o);
    });
    sel.value = VoiceCfg.voice;
  }
  function label(n){
    var short = String(n).replace(/^Microsoft\s*/, "");
    if (/Yaoyao/i.test(short))   return short + "（童声 · 推荐）";
    if (/Huihui/i.test(short))   return short + "（女声）";
    if (/Kangkang/i.test(short)) return short + "（男声）";
    return short;
  }
  if (ipcVoice && ipcVoice.invoke){
    ipcVoice.invoke("pet-voice-list").then(function(list){
      var zh = (list || []).filter(function(v){ return /zh/i.test(v.lang || ""); });
      if (!zh.length) zh = [{ name: "Microsoft Yaoyao" }, { name: "Microsoft Huihui" }];
      fill(zh.map(function(v){ return { voice: String(v.name).replace(/^Microsoft\s*/, ""), label: label(v.name) }; }));
    }).catch(function(){
      fill([{ voice: "Yaoyao", label: "Yaoyao（童声 · 推荐）" }, { voice: "Huihui", label: "Huihui（女声）" }]);
    });
  } else {
    fill([{ voice: "Yaoyao", label: "Yaoyao（童声 · 推荐）" },
          { voice: "Huihui", label: "Huihui（女声）" },
          { voice: "Kangkang", label: "Kangkang（男声）" }]);
  }
}

/* ============================================================
   🚶 散步 AI
   ============================================================ */
var actionTimer = null;
function scheduleAction(){
  clearTimeout(actionTimer);
  actionTimer = setTimeout(doRandomAction, rand(CONFIG.idleMinMs, CONFIG.idleMaxMs));
}
function phaseSpeed(){
  if (state.phase === "evening") return 0.68;
  if (state.phase === "night" || state.phase === "deep") return 0;
  return 1;
}
function doRandomAction(){
  if (state.sleeping || state.dragging || state.menuOpen || state.walking || patting){
    scheduleAction(); return;
  }
  var pool = (state.mood === "bored")
    ? ["look", "sit", "preen", "idle", "walk"]
    : ["walk","walk","walk","look","sit","preen","idle"];
  var act = pick(pool);
  if (act === "walk") walkTo(rand(layout.xMin, layout.xMax), null, false);
  else if (act === "look") addTmp("looking", 1750);
  else if (act === "sit") addTmp("sitting", 4200);
  else if (act === "preen") addTmp("preening", 2200);
  if (state.phase === "evening" && Math.random() < 0.3) addTmp("yawning", 2500);
  scheduleAction();
}
function stopWalk(){
  state.walking = false;
  pet.classList.remove("walking", "looking");
}
function walkTo(targetX, cb, short){
  if (state.sleeping) return;
  var mult = phaseSpeed();
  if (mult === 0) return;
  targetX = clamp(targetX, layout.xMin, layout.xMax);
  var dist = Math.abs(targetX - state.x);
  if (dist < 18){ if (cb) cb(); return; }
  state.facing = targetX > state.x ? 1 : -1;
  applyFacing();
  state.walking = true;
  pet.classList.add("walking");
  var speed = (state.mood === "bored" ? CONFIG.walkSpeedBored : CONFIG.walkSpeed) * mult;
  if (short) speed *= 0.85;
  var last = performance.now(), pauseUntil = 0, edgeTurnBudget = 0;
  function step(now){
    if (!state.walking) return;
    var dt = Math.min(0.05, (now - last) / 1000); last = now;
    if (now > pauseUntil){
      state.x += state.facing * speed * dt;
      if (Math.random() < 0.012){
        pauseUntil = now + rand(500, 1300);
        pet.classList.add("looking");
        setTimeout(function(){ if (state.walking) pet.classList.remove("looking"); }, 950);
      }
    }
    if (state.x <= layout.xMin || state.x >= layout.xMax){
      state.x = clamp(state.x, layout.xMin, layout.xMax);
      if (edgeTurnBudget === 0){
        edgeTurnBudget = rand(70, 150);
        state.facing *= -1; applyFacing();
        targetX = clamp(state.x + state.facing * edgeTurnBudget, layout.xMin, layout.xMax);
      }
    }
    var arrived = (state.facing > 0 && state.x >= targetX) || (state.facing < 0 && state.x <= targetX);
    if (arrived){ stopWalk(); render(); if (cb) cb(); return; }
    render();
    requestAnimationFrame(step);
  }
  requestAnimationFrame(step);
}

/* ============================================================
   💬 气泡 / 碎碎念 / 整点提醒
   ============================================================ */
var sayTimer = null, talkTimer = null, lastSpoke = 0;
function say(text, ms, big, speakIt){
  bubble.innerHTML = fill(text);
  bubble.classList.toggle("big", !!big);
  var c = petCenter(), off = 0;
  if (c.x < 105) off = 105 - c.x;
  if (c.x > window.innerWidth - 105) off = (window.innerWidth - 105) - c.x;
  bubble.style.left = "calc(50% + " + off.toFixed(0) + "px)";
  bubble.classList.add("show");
  clearTimeout(sayTimer);
  sayTimer = setTimeout(function(){ bubble.classList.remove("show"); }, ms || CONFIG.bubbleShowMs);
  var now = Date.now();
  if (!state.sleeping && (speakIt || (now - lastSpoke > 25000 && Math.random() < 0.45))){
    lastSpoke = now;
    Speech.speak(bubble.textContent);
  }
}
function randomTalk(){
  var pool = (LINES[state.mood] || []).slice();
  if (state.bond >= 60) pool = pool.concat(LINES.close);
  var text = (Math.random() < 0.7 && pool.length) ? pick(pool) : pick(LINES.common);
  say(text, CONFIG.bubbleShowMs, false, true);
}
function scheduleTalk(){
  clearTimeout(talkTimer);
  talkTimer = setTimeout(function(){
    if (!state.sleeping && !state.menuOpen) randomTalk();
    scheduleTalk();
  }, rand(CONFIG.bubbleMinMs, CONFIG.bubbleMaxMs));
}
setInterval(function(){
  Sfx.bell();
  addTmp("flap", 900);
  if (!state.sleeping) say("{name}，已经坐了很久啦，站起来活动活动吧！💦", 7000, true, true);
}, CONFIG.hourlyMs);

/* ============================================================
   😉 眨眼 / 随机搭话
   ============================================================ */
var blinkTimer = null;
function scheduleBlink(){
  clearTimeout(blinkTimer);
  blinkTimer = setTimeout(function(){
    if (!state.sleeping){
      pet.classList.add("blink");
      setTimeout(function(){ pet.classList.remove("blink"); }, 145);
    }
    scheduleBlink();
  }, rand(CONFIG.blinkMinMs, CONFIG.blinkMaxMs));
}
setInterval(function(){
  if (state.sleeping || state.dragging) return;
  if (Math.random() < 0.35) Sfx.idleChirp();
}, 45000);

/* 主循环 */
var lastTick = Date.now(), bondDecayAcc = 0;
setInterval(function(){
  var now = Date.now(), dt = now - lastTick; lastTick = now;
  var idle = now - state.lastInteract;
  if (idle > 45000) state.happiness = Math.max(0, state.happiness - dt / 60000);
  if (idle > 600000){
    bondDecayAcc += dt;
    if (bondDecayAcc > 600000){
      bondDecayAcc = 0;
      state.bond = clamp(state.bond - 1, 0, CONFIG.bondMax);
      LS("petBond", String(Math.round(state.bond)));
    }
  }
  updatePhase();
  updateMood();
  updateBadge();
}, 250);
setInterval(tickCompanion, 1000);
setInterval(updateBadge, 10000);

/* ============================================================
   ✨ 特效
   ============================================================ */
function currentFlowers(){
  var cls = SKINS[state.skinIndex] ? SKINS[state.skinIndex].cls : "";
  if (cls === "skin-christmas") return FLOWERS_XMAS;
  if (cls === "skin-newyear")   return FLOWERS_NY;
  return FLOWERS;
}
function burst(x, y, n){
  n = n || 12;
  var pool = currentFlowers();
  for (var i = 0; i < n; i++){
    var el = document.createElement("span");
    el.className = "fx";
    el.textContent = pick(pool);
    el.style.setProperty("--x", x + "px");
    el.style.setProperty("--y", y + "px");
    var a = Math.random() * Math.PI * 2, d = rand(40, 130);
    el.style.setProperty("--tx", (Math.cos(a) * d).toFixed(0) + "px");
    el.style.setProperty("--ty", (Math.sin(a) * d - 30).toFixed(0) + "px");
    el.style.setProperty("--rot", rand(-300, 300).toFixed(0) + "deg");
    el.style.setProperty("--fs", rand(13, 22).toFixed(0) + "px");
    el.style.setProperty("--dur", rand(0.8, 1.4).toFixed(2) + "s");
    fx.appendChild(el);
    removeLater(el, 1700);
  }
}
function hearts(x, y, n){
  n = n || 4;
  for (var i = 0; i < n; i++){
    (function(i){
      setTimeout(function(){
        var el = document.createElement("span");
        el.className = "fx";
        el.textContent = pick(["❤️","💖","💕","💗"]);
        el.style.setProperty("--x", (x + rand(-22, 22)).toFixed(0) + "px");
        el.style.setProperty("--y", y + "px");
        el.style.setProperty("--tx", rand(-18, 18).toFixed(0) + "px");
        el.style.setProperty("--ty", (-rand(30, 60)).toFixed(0) + "px");
        el.style.setProperty("--fs", rand(13, 20).toFixed(0) + "px");
        el.style.setProperty("--dur", rand(0.9, 1.4).toFixed(2) + "s");
        fx.appendChild(el);
        removeLater(el, 1700);
      }, i * 130);
    })(i);
  }
}
function spawnFish(x, y){
  var el = document.createElement("span");
  el.className = "fish"; el.textContent = "🐟";
  el.style.setProperty("--x", x + "px");
  el.style.setProperty("--y", y + "px");
  fx.appendChild(el);
  removeLater(el, 1200);
}
function spawnZzz(x, y){
  var el = document.createElement("span");
  el.className = "zzz"; el.textContent = pick(["Z","z","Zz"]);
  el.style.setProperty("--x", x + "px");
  el.style.setProperty("--y", y + "px");
  fx.appendChild(el);
  removeLater(el, 2800);
}
function chorus(text, x, y){
  var el = document.createElement("span");
  el.className = "chorus"; el.textContent = text;
  el.style.setProperty("--x", x + "px");
  el.style.setProperty("--y", y + "px");
  fx.appendChild(el);
  removeLater(el, 1300);
}
function removeLater(el, ms){
  setTimeout(function(){ if (el.parentNode) el.parentNode.removeChild(el); }, ms);
}

/* ============================================================
   🎨 皮肤 / 造型 / 体型
   ============================================================ */
function applySkin(i){
  state.skinIndex = ((i % SKINS.length) + SKINS.length) % SKINS.length;
  SKINS.forEach(function(s){ pet.classList.remove(s.cls); });
  pet.classList.add(SKINS[state.skinIndex].cls);
  LS("petSkinIndex", String(state.skinIndex));
}
function applyOutfit(i){
  state.outfitIndex = ((i % OUTFITS.length) + OUTFITS.length) % OUTFITS.length;
  OUTFITS.forEach(function(o){ pet.classList.remove(o.cls); });
  pet.classList.add(OUTFITS[state.outfitIndex].cls);
  LS("petOutfitIndex", String(state.outfitIndex));
}
function applyGrow(){ pet.style.setProperty("--grow", state.grow.toFixed(3)); }

/* ============================================================
   🚀 初始化
   ============================================================ */
function init(){
  var savedSkin = parseInt(LS("petSkinIndex") || "0", 10) || 0;
  var savedOutfit = parseInt(LS("petOutfitIndex") || "0", 10) || 0;
  state.userName = LS("petUserName") || "";
  state.petName = LS("petPetName") || CONFIG.petName;
  /* 说话声音设置 */
  VoiceCfg.mode = LS("petVoiceMode") || "animalese";
  VoiceCfg.voice = LS("petVoiceName") || "Yaoyao";
  VoiceCfg.pitch = parseInt(LS("petVoicePitch") || "35", 10);
  VoiceCfg.rate = parseInt(LS("petVoiceRate") || "8", 10);
  state.bond = parseFloat(LS("petBond") || "12") || 12;
  state.full = parseInt(LS("petFull") || "0", 10) || 0;
  state.grow = 1 + state.full * 0.022;
  state.goalLabel = LS("petGoalLabel") || "出发";
  state.goalDate = LS("petGoalDate") || "";
  state.showTime = LS("petShowTime") !== "0";
  state.showBond = LS("petShowBond") !== "0";
  state.showBadge = LS("petShowBadge") !== "0";
  state.badgeMode = LS("petBadgeMode") || "2h";
  /* 刚打开先亮 1 分钟让你看到，之后按设置（默认每 2 小时）偶尔出现 */
  state.badgeShownUntil = Date.now() + 60000;
  LS("petBadgeLast", String(Date.now()));
  Sfx.setLevel(parseInt(LS("petSoundLevel") || "2", 10) || 2);

  relayout();
  state.x = clamp(window.innerWidth * 0.62, layout.xMin, layout.xMax);
  state.y = layout.yMax;
  render();
  applyFacing();
  applySkin(savedSkin);
  applyOutfit(savedOutfit);
  applyGrow();
  setMood("happy");
  updatePhase();
  updateBadge();
  try {
    var rec = JSON.parse(LS("petCompanion") || "{}");
    if (rec && rec.date === new Date().toISOString().slice(0, 10)) state.todaySeconds = rec.sec || 0;
  } catch(e){}

  scheduleBlink();
  scheduleTalk();
  scheduleAction();

  setTimeout(function(){
    var hi = state.userName
      ? ("欢迎回来呀，" + state.userName + "！我是" + CONFIG.petName + "，右键点我可以互动哦~")
      : ("你好呀！我是" + CONFIG.petName + "，右键点我可以互动哦~");
    say(hi, 4600, false, true);
  }, 1200);
  if (!state.userName){
    setTimeout(function(){ say("对了，右键 → ✏️改称呼，我就能叫你的名字啦~", 5000); }, 13000);
  }
  if (state.phase === "night" || state.phase === "deep"){
    setTimeout(function(){ enterAutoSleep(state.phase); }, 1500);
  }
  setIgnore(true);
}
window.addEventListener("resize", relayout);
init();

})();
</script>
