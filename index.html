<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>致 韩玉 💗</title>
<!-- 内嵌 favicon（emoji 爱心，纯 data URI，断网可用） -->
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%F0%9F%92%97%3C/text%3E%3C/svg%3E">

<style>
/* ============================================================
   🎨 全局变量：修改颜色 / 字体都在这里
   ============================================================ */
:root{
  --ink:#c2185b;            /* 正文玫红色，可在此调整深浅 */
  --ink-deep:#9c1a4c;       /* 强调深红 */
  --pink-soft:#ffe4ef;      /* 浅粉 */
  --pink-mid:#ffb9d0;       /* 中粉 */
  --rose:#ff4f8b;           /* 玫瑰粉 */
  --rose-deep:#e03472;      /* 深玫瑰（按钮渐变用） */
  --warm:#fff8fa;           /* 暖白 */
  --font-kai:"Kaiti SC","STKaiti","KaiTi","楷体","DFKai-SB","FangSong","SimSun",serif;  /* 书法感字体 */
  --font-body:"PingFang SC","Microsoft YaHei","Hiragino Sans GB","Source Han Sans SC",sans-serif;
}

*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%}
body{
  font-family:var(--font-body);
  overflow-x:hidden;
  /* 粉 → 淡紫 柔和渐变背景 */
  background:linear-gradient(160deg,#ffe3ef 0%,#ffd3e6 32%,#f0d5f5 68%,#e3d3f6 100%);
  background-attachment:fixed;
  color:var(--ink);
  -webkit-font-smoothing:antialiased;
}

/* 页面文字锁定/解锁（弹窗期间禁止滚动） */
body.lock{overflow:hidden}

/* ============================================================
   🌌 1. 光晕 + 星空微光粒子
   ============================================================ */
#glow-layer{position:fixed;inset:0;z-index:1;pointer-events:none}
.glow-orb{
  position:absolute;border-radius:50%;
  opacity:.5;animation:orb-drift 16s ease-in-out infinite alternate;
}
.glow-a{width:62vmax;height:62vmax;left:-18vmax;top:-22vmax;
  background:radial-gradient(circle,rgba(255,183,213,.55),rgba(255,183,213,0) 62%)}
.glow-b{width:56vmax;height:56vmax;right:-16vmax;bottom:-20vmax;animation-delay:-8s;
  background:radial-gradient(circle,rgba(196,181,253,.42),rgba(196,181,253,0) 62%)}
@keyframes orb-drift{
  from{transform:translate(0,0) scale(1)}
  to{transform:translate(4vmax,3vmax) scale(1.12)}
}

#star-field{position:fixed;inset:0;z-index:2;overflow:hidden;pointer-events:none}
.star{
  position:absolute;border-radius:50%;
  background:#fff;opacity:0;
  animation:twinkle var(--dur,4s) ease-in-out var(--delay,0s) infinite;
  box-shadow:0 0 6px 1px rgba(255,255,255,.7);
}
@keyframes twinkle{
  0%,100%{opacity:0;transform:scale(.6)}
  50%{opacity:.9;transform:scale(1)}
}

/* ============================================================
   🌹 2. 玫瑰花瓣飘落层
   ============================================================ */
#petal-layer{position:fixed;inset:0;z-index:3;overflow:hidden;pointer-events:none}
.falling-petal{
  position:absolute;top:-8vh;
  border-radius:100% 0 100% 0; /* 花瓣形 */
  animation:petal-fall var(--dur,10s) linear var(--delay,0s) forwards;
  will-change:transform;
}
/* 花瓣下落 + 左右摇摆 + 旋转，位移由 JS 每片随机赋值 */
@keyframes petal-fall{
  0%  {transform:translate3d(0,0,0) rotate(0deg)}
  25% {transform:translate3d(var(--sw1),28vh,0) rotate(var(--rot-a,90deg))}
  50% {transform:translate3d(var(--sw2),56vh,0) rotate(var(--rot-b,200deg))}
  75% {transform:translate3d(var(--sw3),84vh,0) rotate(var(--rot-c,330deg))}
  100%{transform:translate3d(var(--sw2),115vh,0) rotate(var(--rot-d,460deg));opacity:.2}
}

/* ============================================================
   🎈 3. 气球（纯 CSS 绘制，两侧漂浮）
   ============================================================ */
#balloons{position:fixed;inset:0;z-index:4;overflow:hidden;pointer-events:none}
.balloon{position:absolute;animation:floaty var(--dur,7s) ease-in-out var(--delay,0s) infinite}
/* 气球身体：上圆下略收 + 玻璃反光 */
.balloon i{
  position:relative;display:block;width:var(--sz,58px);aspect-ratio:.84;
  border-radius:50% 50% 50% 50% / 58% 58% 42% 42%;
  box-shadow:inset -6px -8px 16px rgba(180,60,110,.18), 0 6px 14px rgba(200,90,130,.22);
}
.balloon i::before{ /* 高光 */
  content:"";position:absolute;left:16%;top:12%;width:30%;height:22%;
  border-radius:50%;background:rgba(255,255,255,.75);transform:rotate(-18deg);
}
.balloon i::after{ /* 气球线 */
  content:"";position:absolute;left:50%;top:96%;width:0;height:92px;
  border-left:1.5px dashed rgba(160,90,120,.55);
}
.balloon.b-white i{background:linear-gradient(140deg,#fffdfe,#ffd9e6 78%)}
.balloon.b-red  i{background:linear-gradient(140deg,#ffb3c4,#ff5f82 82%)}
@keyframes floaty{ /* 上下浮动 + 轻微左右摇摆 */
  0%,100%{transform:translateY(-14px) rotate(-3.5deg)}
  50%   {transform:translateY(16px)  rotate(3.5deg)}
}

/* ============================================================
   💌 4. 表白正文（初始隐藏，点「我愿意」后淡入）
   ============================================================ */
#letter{
  position:relative;z-index:10;
  max-width:660px;margin:0 auto;
  padding:9vh 22px 70vh;              /* 底部留白给彩蛋卡片 */
  opacity:0;visibility:hidden;
  transform:translateY(26px);
  transition:opacity 1.4s ease .2s,transform 1.4s ease .2s,visibility 0s 1.6s;
}
#letter.visible{opacity:1;visibility:visible;transform:none;transition:opacity 1.4s ease .2s,transform 1.4s ease .2s}

/* —— 标题「致 韩玉」书法感 —— */
.letter-title{
  text-align:center;font-family:var(--font-kai);
  font-size:clamp(34px,6vw,50px);font-weight:700;letter-spacing:.35em;
  padding-left:.35em; /* 抵消末字字距，保证视觉居中 */
  color:var(--ink-deep);
  text-shadow:0 2px 14px rgba(255,255,255,.8);
  animation:title-in 2.2s ease both;
}
@keyframes title-in{from{opacity:0;letter-spacing:.9em;filter:blur(4px)}to{opacity:1;filter:blur(0)}}
.title-flourish{ /* 标题下的装饰线 */
  margin:22px auto 0;width:min(190px,50%);height:2px;
  background:linear-gradient(90deg,transparent,var(--rose),transparent);
  border-radius:2px;position:relative;
}
.title-flourish::after{ /* 线中央的小花 */
  content:"❀";position:absolute;left:50%;top:-12px;transform:translateX(-50%);
  color:var(--rose);font-size:19px;
}

/* —— 信笺正文 —— */
.letter-body{
  margin-top:56px;
  font-family:var(--font-kai);
  font-size:clamp(16.5px,2.2vw,19px);
  line-height:2.1;color:var(--ink);
  text-shadow:0 1px 2px rgba(255,255,255,.6);
}
.letter-body p{margin:0 0 1.9em;text-indent:2em;min-height:1em} /* 段首缩进，古风信笺 */
.letter-body p.sign{margin-top:3em;text-align:right;text-indent:0;padding-right:14px;
  letter-spacing:.15em;color:var(--ink-deep)}

/* 打字光标：轻轻跳动的小竖条 */
.caret{
  display:inline-block;width:2px;height:1.15em;margin-left:3px;vertical-align:-2px;
  background:var(--ink);border-radius:1px;
  animation:caret-blink .85s steps(2) infinite;
}
@keyframes caret-blink{0%,100%{opacity:1}50%{opacity:0}}

/* ============================================================
   🎁 5. 时光彩蛋卡片（愿与卿共度 + 计时器）
   ============================================================ */
#love-card{
  position:relative;z-index:10;
  max-width:540px;margin:-46vh auto 12vh;
  padding:26px 24px 24px;text-align:center;
  border-radius:20px;
  background:linear-gradient(160deg,rgba(255,250,252,.92),rgba(255,229,240,.88));
  border:1px solid rgba(255,255,255,.9);
  box-shadow:0 12px 40px rgba(194,24,91,.16), inset 0 0 0 6px rgba(255,255,255,.35);
  backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);
  opacity:0;visibility:hidden;transform:translateY(30px) scale(.96);
  transition:opacity 1.3s ease,transform 1.3s ease,visibility 0s 1.3s;
}
#love-card.show{opacity:1;visibility:visible;transform:none}
.card-title{
  font-family:var(--font-kai);font-size:clamp(21px,3.4vw,26px);
  letter-spacing:.5em;padding-left:.5em;color:var(--ink-deep);font-weight:700;
}
.card-title::before,.card-title::after{content:"❀ ";color:var(--rose);font-size:14px}
.card-timer{
  margin-top:16px;display:flex;align-items:center;justify-content:center;gap:12px;
  font-family:var(--font-kai);font-size:clamp(15px,2.4vw,18px);color:var(--ink);
}
.card-timer .num{font-weight:700;letter-spacing:.04em;
  font-variant-numeric:tabular-nums}
.beat-heart{ /* 计时器旁跳动的小红心 */
  display:inline-block;color:var(--rose);font-size:22px;line-height:1;
  animation:beat 1s ease-in-out infinite;transform-origin:center;
  filter:drop-shadow(0 2px 4px rgba(255,79,139,.5));
}
@keyframes beat{
  0%,100%{transform:scale(1)}
  12%{transform:scale(1.32)}
  24%{transform:scale(1)}
  36%{transform:scale(1.2)}
  50%{transform:scale(1)}
}
.card-sub{margin-top:14px;font-size:12.5px;color:var(--ink-deep);opacity:.75;letter-spacing:.2em}

/* ============================================================
   💝 6. 弹窗（毛玻璃 + 表白语 + 两个按钮）
   ============================================================ */
#overlay{
  position:fixed;inset:0;z-index:500;
  display:flex;align-items:center;justify-content:center;padding:18px;
  background:rgba(255,215,232,.38);
  backdrop-filter:blur(9px);-webkit-backdrop-filter:blur(9px);
  opacity:0;visibility:hidden;
  transition:opacity .6s ease,visibility 0s .6s;
}
#overlay.show{opacity:1;visibility:visible;transition:opacity .6s ease}
#modal{
  position:relative;
  width:min(430px,94vw);
  padding:30px 26px 26px;text-align:center;
  border-radius:24px;
  background:linear-gradient(165deg,rgba(255,253,254,.9),rgba(255,236,245,.86));
  border:1px solid rgba(255,255,255,.95);
  box-shadow:0 20px 60px rgba(180,60,110,.25), inset 0 0 0 5px rgba(255,255,255,.4);
  transform:scale(.82) translateY(26px);opacity:0;
  transition:transform .65s cubic-bezier(.22,1.3,.4,1),opacity .5s ease;
}
#overlay.show #modal{transform:none;opacity:1}

/* 弹窗顶部爱心 icon */
.modal-heart{
  width:58px;height:58px;margin:0 auto 14px;border-radius:50%;
  display:flex;align-items:center;justify-content:center;
  font-size:26px;color:#fff;
  background:radial-gradient(circle at 32% 28%,#ff9dba,#e91e63 72%);
  box-shadow:0 8px 20px rgba(233,30,99,.4);
  animation:heart-float 2.6s ease-in-out infinite;
}
@keyframes heart-float{0%,100%{transform:translateY(0)}50%{transform:translateY(-6px)}}

/* 弹窗表白词 */
.m-line{margin:7px 0;font-family:var(--font-kai);color:var(--ink)}
.m-s  {font-size:clamp(13px,3vw,15px);opacity:.88;letter-spacing:.3em;padding-left:.3em}
.m-m  {font-size:clamp(20px,5.4vw,25px);font-weight:700;letter-spacing:.18em;padding-left:.18em}
.m-em {font-size:clamp(19px,4.6vw,25px);font-weight:700;color:#d81b60;letter-spacing:.2em;padding-left:.2em}
.m-q  { /* 最醒目的一句 */
  margin-top:20px;font-size:clamp(19px,5.4vw,27px);font-weight:800;
  color:var(--ink-deep);line-height:1.6;
  text-shadow:0 2px 10px rgba(255,79,139,.35);
}
.m-q b{color:#e91e63}

/* 按钮区 */
.btn-row{margin-top:26px;display:flex;justify-content:center;align-items:center;gap:clamp(10px,3vw,18px);flex-wrap:wrap}
.btn{
  border:none;cursor:pointer;border-radius:999px;
  font-family:var(--font-body);font-weight:700;
  transition:box-shadow .3s ease,font-size .3s ease,padding .3s ease,background .3s ease;
  user-select:none;-webkit-user-select:none;
}
/* 「我愿意」：粉渐变、更大、呼吸动画 */
.btn-yes{
  padding:15px 38px;font-size:17px;color:#fff;letter-spacing:.12em;
  background:linear-gradient(135deg,#ff7aa8,#e91e63 70%,#d81b60);
  box-shadow:0 10px 24px rgba(233,30,99,.42), inset 0 1px 0 rgba(255,255,255,.5);
  animation:breathe 2.4s ease-in-out infinite;
}
.btn-yes:hover{box-shadow:0 14px 30px rgba(233,30,99,.55)}
@keyframes breathe{ /* 呼吸：微微放大缩小 */
  0%,100%{transform:scale(1)}
  50%{transform:scale(1.055)}
}
/* 「不愿意」：白色小一号（它会逃跑😉） */
.btn-no{
  position:relative;padding:11px 22px;font-size:13.5px;color:#9aa0a6;
  background:#fff;border:1.5px solid #e3e6ea;
  box-shadow:0 4px 12px rgba(160,160,170,.16);
  transition:transform .55s cubic-bezier(.3,1.6,.5,1),box-shadow .3s ease,font-size .3s ease,padding .3s ease,border-color .3s ease,color .3s ease;
  will-change:transform;
}
.btn-no:hover{box-shadow:0 6px 16px rgba(160,160,170,.3)}
.btn-no.final{border-color:var(--rose);color:var(--rose);animation:no-plead 2.2s ease-in-out infinite}
@keyframes no-plead{0%,100%{transform:translateY(0)}50%{transform:translateY(-4px)}}

/* 特效粒子层（爆发爱心 / 鼠标拖尾 / 点击开花，永远最高层） */
#fx{position:fixed;inset:0;z-index:999;pointer-events:none;overflow:hidden}
.fx-heart,.fx-petal{position:absolute;left:var(--x);top:var(--y);line-height:1;will-change:transform,opacity}
.fx-heart{animation:burst-fly var(--bd,.9s) cubic-bezier(.12,.6,.3,1) forwards;color:var(--hc,#ff4f8b)}
.fx-petal{border-radius:100% 0 100% 0;background:var(--pc,linear-gradient(135deg,#ffb3c6,#ff5f8f));animation:burst-fly var(--bd,.9s) cubic-bezier(.12,.6,.3,1) forwards}
@keyframes burst-fly{
  0%  {transform:translate(-50%,-50%) scale(.15) rotate(0deg);opacity:1}
  100%{transform:translate(calc(-50% + var(--bx)),calc(-50% + var(--by))) scale(var(--bs,1)) rotate(var(--br,240deg));opacity:0}
}
.fx-trail{
  position:absolute;left:var(--x);top:var(--y);border-radius:100% 0 100% 0;
  background:var(--tc,linear-gradient(135deg,#ffc2d4,#ff8fae));
  animation:trail-fade var(--td,.9s) ease-out forwards;will-change:transform,opacity;
}
@keyframes trail-fade{
  0%  {transform:translate(-50%,-50%) scale(1) rotate(0deg);opacity:.95}
  100%{transform:translate(calc(-50% + var(--tx)),calc(-50% + var(--ty))) scale(.3) rotate(var(--tr,140deg));opacity:0}
}

/* 小提示（点击正文可跳过打字） */
#tip{
  position:fixed;left:50%;bottom:14px;transform:translateX(-50%);
  z-index:12;font-size:12px;color:var(--ink-deep);opacity:0;letter-spacing:.14em;
  transition:opacity 1s ease;pointer-events:none;
  background:rgba(255,255,255,.55);padding:5px 14px;border-radius:999px;backdrop-filter:blur(3px);
}

/* ============================================================
   📱 响应式 + 无障碍
   ============================================================ */
@media (max-width:700px){ /* 手机端：气球退场，交给花瓣和星星 */
  #balloons{display:none}
  #letter{padding-top:7vh}
}
@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation-duration:.01ms !important;animation-iteration-count:1 !important;transition-duration:.01ms !important}
}
</style>
</head>
<body class="lock">

<!-- 光晕 -->
<div id="glow-layer"><div class="glow-orb glow-a"></div><div class="glow-orb glow-b"></div></div>
<!-- 星空微光（星星由 JS 生成） -->
<div id="star-field"></div>
<!-- 飘落玫瑰花瓣（由 JS 生成） -->
<div id="petal-layer"></div>
<!-- 气球（左右两侧） -->
<div id="balloons">
  <div class="balloon b-white" style="left:4vw;top:16vh;--sz:64px;--dur:7.2s;--delay:-1s"><i></i></div>
  <div class="balloon b-red"   style="left:7.5vw;top:66vh;--sz:46px;--dur:8.6s;--delay:-5s"><i></i></div>
  <div class="balloon b-red"   style="right:5vw;top:22vh;--sz:52px;--dur:7.8s;--delay:-3s"><i></i></div>
  <div class="balloon b-white" style="right:7vw;top:72vh;--sz:40px;--dur:9.2s;--delay:-6s"><i></i></div>
</div>

<!-- 💌 表白正文（第三步） -->
<main id="letter">
  <h1 class="letter-title">致&nbsp;韩&nbsp;玉</h1>
  <div class="title-flourish"></div>
  <!-- 正文段落由 JS 按下方 LETTER 数组生成并逐字打出 -->
  <div class="letter-body" id="letterBody"></div>
</main>

<!-- 🎁 时光彩蛋卡片（第四步） -->
<section id="love-card">
  <div class="card-title">愿与卿共度</div>
  <div class="card-timer">
    <span class="beat-heart">💗</span>
    <span>在一起的第 <span class="num" id="days">1</span> 天</span>
    <span class="num" id="clock">00:00:00</span>
  </div>
  <div class="card-sub">与你在一起的时光，分秒皆是温柔</div>
</section>

<!-- 💝 表白弹窗（第一步） -->
<div id="overlay" aria-hidden="true">
  <div id="modal" role="dialog" aria-label="表白弹窗">
    <div class="modal-heart">♥</div>
    <div class="m-line m-s">浮世三千，吾爱有三</div>
    <div class="m-line m-m">日、月与卿</div>
    <div class="m-line m-s">日为朝，月为暮</div>
    <div class="m-line m-em">卿为朝朝暮暮</div>
    <div class="m-q">韩玉，你愿意<br><b>做我的女朋友</b>吗？</div>
    <div class="btn-row">
      <button class="btn btn-yes" id="btnYes" type="button">我愿意</button>
      <button class="btn btn-no" id="btnNo" type="button">对不起，我不愿意</button>
    </div>
  </div>
</div>

<!-- 特效层 -->
<div id="fx"></div>
<div id="tip">（点击正文可跳过打字，直达彩蛋）</div>

<noscript><div style="padding:40px;text-align:center">此页面需要启用 JavaScript 才能展示，请开启后刷新 🥺</div></noscript>

<script>
(function(){
"use strict";

/* ============================================================
   ✏️ 在这里修改配置！正文文字请改下方的 LETTER 数组
   ============================================================ */
var CONFIG = {
  starCount: 0,        // 星星数量（0 = 按屏幕大小自动）
  petalGapMs: 320,     // 每多久飘落一片花瓣（毫秒，越大越稀）
  typingBaseMs: 50,    // 打字速度基准（毫秒/字，越大越慢）
  typingJitterMs: 80,  // 打字速度随机浮动，让节奏更自然
  pauseAfterParaMs: 1500, // 每段打完后的停顿（毫秒）
  heartsCount: 46      // 点「我愿意」时的爱心爆发数量
};

/* 📜 表白正文 —— 每个数组元素是一段；最后一段是落款（sign 类，右对齐） */
var LETTER = [
  "窗外梧桐又落了半阶，晚风卷着浅淡的桂香拂过案头，墨汁微凉，提笔竟不知从何说起，只满心满眼，皆是你的模样。",
  "这人世浮沉，山河辗转，我曾以为余生不过是孤身看尽人间烟火，于尘世间潦草度日，不曾想，会与你相逢。你是人间惊鸿客，亦是我心尖意，初见时你眉眼含笑，恰似江南烟雨里的一抹柔光，落在我心底，便再也不曾散去。",
  "我怀念从前岁月里的慢，车马慢，书信远，一生只够爱一人。每每念及你，便觉得人间值得，晨起的朝露，黄昏的落日，巷口的老槐树，就连笔下的字字句句，都因你多了几分温柔。不敢说什么轰轰烈烈的誓言，只愿将满心情愫，都藏在这素笺墨痕里，一字一句，皆是真心。",
  "我对你的心意，从不是一时兴起，而是深思熟虑的笃定。不似繁花绚烂夺目，却如细水长流，绵长不绝。愿往后余生，春赏百花冬观雪，醒亦念卿，梦亦念卿；愿跨越山海，历经岁月，始终执子之手，共赴一世情长。",
  "纸短情长，言不尽意，万千思念，皆付笔端。",
  {sign:"—— 连天瑜"}
];

/* 爱心/桃花爆发与拖尾可用的符号（本地字符，断网可用） */
var HEART_CHARS = ["♥","♡","♥","💗","💕","🌸","❀","✿","💞"];
var HEART_COLORS = ["#ff4f8b","#e03472","#ff8fb0","#d6336c","#ff6f9c"];

/* ============================================================
   小工具
   ============================================================ */
function $(id){return document.getElementById(id);}
function rand(a,b){return a + Math.random()*(b-a);}
function randInt(a,b){return Math.floor(rand(a,b+1));}
function clamp(v,min,max){return Math.min(max,Math.max(min,v));}
function pad2(n){return (n<10?"0":"")+n;}
var reducedMotion = window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches;

/* ============================================================
   🌌 生成星空微光
   ============================================================ */
(function buildStars(){
  var field = $("star-field");
  var w = window.innerWidth, h = window.innerHeight;
  var n = CONFIG.starCount || Math.min(90, Math.floor(w*h/16000));
  var f = document.createDocumentFragment();
  for(var i=0;i<n;i++){
    var s = document.createElement("span");
    s.className = "star";
    var size = rand(1,2.6);
    s.style.cssText = "left:"+rand(0,100)+"vw;top:"+rand(0,100)+"vh;"+
      "width:"+size+"px;height:"+size+"px;"+
      "--dur:"+rand(2.2,5.5).toFixed(2)+"s;--delay:"+rand(0,6).toFixed(2)+"s";
    f.appendChild(s);
  }
  field.appendChild(f);
})();

/* ============================================================
   🌹 玫瑰花瓣持续飘落
   ============================================================ */
var PETAL_COLORS = [
  "linear-gradient(135deg,#ffd0de,#ff8fae)",
  "linear-gradient(135deg,#ffc2d4,#ff6f97)",
  "linear-gradient(135deg,#ffb8c8,#ff4f82)",
  "linear-gradient(135deg,#ffe1ea,#ff9db8)",
  "linear-gradient(135deg,#fecdd3,#f4729a)"
];
function spawnFallingPetal(){
  var layer = $("petal-layer");
  var p = document.createElement("span");
  p.className = "falling-petal";
  var size = rand(11,20);
  var dur = rand(7.5,15);
  p.style.cssText =
    "left:"+rand(-1,99)+"vw;width:"+size+"px;height:"+size+"px;"+
    "background:"+PETAL_COLORS[randInt(0,PETAL_COLORS.length-1)]+";"+
    "--dur:"+dur.toFixed(1)+"s;"+
    "--sw1:"+rand(-70,70).toFixed(0)+"px;--sw2:"+rand(-90,90).toFixed(0)+"px;--sw3:"+rand(-70,70).toFixed(0)+"px;"+
    "--rot-a:"+rand(70,140).toFixed(0)+"deg;--rot-b:"+rand(180,260).toFixed(0)+"deg;"+
    "--rot-c:"+rand(300,400).toFixed(0)+"deg;--rot-d:"+rand(420,560).toFixed(0)+"deg;"+
    "opacity:"+rand(.55,.95).toFixed(2)+";box-shadow:0 0 6px rgba(255,120,160,.25)";
  layer.appendChild(p);
  /* 动画结束后移除，防止 DOM 无限堆积 */
  setTimeout(function(){ if(p.parentNode) p.parentNode.removeChild(p); }, (dur+2.5)*1000);
}
var petalTimer = setInterval(function(){
  if(!reducedMotion) spawnFallingPetal();
}, CONFIG.petalGapMs);
/* 开场先撒一把，让画面不空 */
if(!reducedMotion){ for(var s0=0;s0<10;s0++){ (function(d){ setTimeout(spawnFallingPetal, d); })(s0*340); } }

/* ============================================================
   🖱️ 鼠标拖尾花瓣 + 点击开花
   ============================================================ */
var fx = $("fx");
function fxRemove(el,ms){ setTimeout(function(){ if(el.parentNode) el.parentNode.removeChild(el); }, ms); }

/* —— 点击爆开小桃花/爱心 —— */
function clickBloom(x,y){
  var n = reducedMotion ? 4 : 12;
  for(var i=0;i<n;i++){
    var ang = Math.random()*Math.PI*2;
    var dist = rand(45,150);
    var el;
    if(Math.random()<0.45){ /* 花瓣 */
      el = document.createElement("span");
      el.className = "fx-petal";
      var size = rand(10,17);
      el.style.width = size+"px"; el.style.height = size+"px";
      el.style.setProperty("--pc", PETAL_COLORS[randInt(0,PETAL_COLORS.length-1)]);
    } else { /* 爱心字符 */
      el = document.createElement("span");
      el.className = "fx-heart";
      el.textContent = HEART_CHARS[randInt(0,HEART_CHARS.length-1)];
      el.style.fontSize = rand(13,26)+"px";
      el.style.setProperty("--hc", HEART_COLORS[randInt(0,HEART_COLORS.length-1)]);
    }
    el.style.setProperty("--x", x+"px");
    el.style.setProperty("--y", y+"px");
    el.style.setProperty("--bx", Math.cos(ang)*dist+"px");
    el.style.setProperty("--by", Math.sin(ang)*dist+"px");
    el.style.setProperty("--br", rand(-320,320).toFixed(0)+"deg");
    el.style.setProperty("--bs", rand(.9,1.5).toFixed(2));
    el.style.setProperty("--bd", rand(.8,1.3).toFixed(2)+"s");
    fx.appendChild(el);
    fxRemove(el,1600);
  }
}

/* —— 鼠标移动拖出淡粉花瓣 —— */
var lastTrail = 0;
function trailAt(x,y){
  var t = Date.now();
  if(t - lastTrail < 60) return; /* 节流，保证流畅 */
  lastTrail = t;
  var el = document.createElement("span");
  el.className = "fx-trail";
  var size = rand(7,13);
  el.style.width = size+"px"; el.style.height = size+"px";
  el.style.setProperty("--x", x+"px");
  el.style.setProperty("--y", y+"px");
  el.style.setProperty("--tx", rand(-46,46).toFixed(0)+"px");
  el.style.setProperty("--ty", rand(-42,-8).toFixed(0)+"px"); /* 微微向上飘 */
  el.style.setProperty("--tr", rand(-160,160).toFixed(0)+"deg");
  el.style.setProperty("--td", rand(.7,1.15).toFixed(2)+"s");
  el.style.setProperty("--tc", PETAL_COLORS[randInt(1,PETAL_COLORS.length-1)]);
  fx.appendChild(el);
  fxRemove(el,1300);
}
if(!reducedMotion){
  window.addEventListener("pointermove", function(e){ trailAt(e.clientX,e.clientY); });
  window.addEventListener("pointerdown", function(e){ if(e.target.closest && e.target.closest("#modal")) return; clickBloom(e.clientX,e.clientY); });
}

/* ============================================================
   💝 弹窗：入场 + 「我愿意」/ 逃跑按钮逻辑
   ============================================================ */
var overlay = $("overlay"), btnYes = $("btnYes"), btnNo = $("btnNo");
setTimeout(function(){ overlay.classList.add("show"); overlay.setAttribute("aria-hidden","false"); }, 800);

var accepted = false;          // 防止重复触发
var refuseTries = 0;           // 「不愿意」被躲/被点的次数
var YES_LABELS = ["我愿意","我当然愿意","这还用问吗？","那就说好啦 ❤","一辈子都愿意"];
var NO_PLEAD_LABEL = "再想想好不好嘛🥺";

/* 逃跑：把「不愿意」弹到随机位置（仍保证在屏幕内） */
function fleeNoBtn(){
  var r = btnNo.getBoundingClientRect();
  var m = 12;
  var dxMin = m - r.left, dxMax = window.innerWidth  - m - r.right;
  var dyMin = m - r.top,  dyMax = window.innerHeight - m - r.bottom;
  var dx = 0, dy = 0, guard = 0;
  do{ /* 至少挪动 50px，避免白躲一次 */
    dx = rand(dxMin, dxMax); dy = rand(dyMin, dyMax*0.85 - 20);
    guard++;
  } while(guard<14 && Math.abs(dx)+Math.abs(dy) < 50);
  btnNo.style.transform = "translate("+dx.toFixed(0)+"px,"+dy.toFixed(0)+"px)";
  /* 轻微的抖动提示 */
  try{ btnNo.animate([{transform:btnNo.style.transform+" rotate(-5deg)"},{transform:btnNo.style.transform+" rotate(5deg)"},{transform:btnNo.style.transform}],{duration:240,iterations:1}); }catch(err){}
  /* 每躲一次，「我愿意」就长大一点、更坚定一点 */
  var grow = Math.min(refuseTries, 4);
  btnYes.style.padding = (15+grow*1.6)+"px "+(38+grow*5)+"px";
  btnYes.style.fontSize = (17+grow*1.2)+"px";
  if(refuseTries < YES_LABELS.length) btnYes.textContent = YES_LABELS[refuseTries];
}

btnNo.addEventListener("mouseenter", function(){ /* 鼠标一靠近它就跑 */
  if(refuseTries < 3) fleeNoBtn();
});
btnNo.addEventListener("click", function(e){ /* 实在点到了，也躲开 */
  e.preventDefault(); e.stopPropagation();
  refuseTries++;
  if(refuseTries < 3){
    fleeNoBtn();
  } else if(refuseTries === 3){
    /* 第三次后：认输撒娇，不再躲 */
    btnNo.textContent = NO_PLEAD_LABEL;
    btnNo.classList.add("final");
    btnNo.style.transform = "none";
    btnYes.textContent = YES_LABELS[YES_LABELS.length-1];
    btnYes.style.padding = "19px 52px"; btnYes.style.fontSize = "20px";
    clickBloom(btnYes.getBoundingClientRect().left + 60, btnYes.getBoundingClientRect().top + 10);
  } else {
    /* 之后每次点击只撒花撒娇，跑是跑不掉了 🥰 */
    clickBloom(e.clientX, e.clientY - 20);
  }
});

/* 开始计时：记录「我愿意」时刻（存 localStorage，刷新也不断档；想清零可在控制台执行 localStorage.removeItem('loveStart')） */
function getStart(){
  try{
    var saved = localStorage.getItem("loveStart");
    if(saved) return parseInt(saved,10)||null;
  }catch(err){}
  return null;
}
function saveStart(t){
  try{ localStorage.setItem("loveStart", String(t)); }catch(err){}
}

/* ============================================================
   💖 接受：爱心爆发 → 淡入正文 → 打字机
   ============================================================ */
var letter = $("letter"), loveCard = $("love-card"), tip = $("tip");

/* 全屏爱心从中心向四周散开 */
function heartBurst(){
  var cx = window.innerWidth/2, cy = window.innerHeight/2;
  var n = reducedMotion ? 14 : CONFIG.heartsCount;
  for(var i=0;i<n;i++){
    var ang = (i/n)*Math.PI*2 + rand(-.18,.18);
    var dist = rand(Math.min(window.innerWidth,window.innerHeight)*0.22, Math.max(window.innerWidth,window.innerHeight)*0.52);
    var el = document.createElement("span");
    el.className = "fx-heart";
    el.textContent = HEART_CHARS[randInt(0,HEART_CHARS.length-1)];
    el.style.fontSize = rand(16,40)+"px";
    el.style.setProperty("--hc", HEART_COLORS[randInt(0,HEART_COLORS.length-1)]);
    el.style.setProperty("--x", cx+"px"); el.style.setProperty("--y", cy+"px");
    el.style.setProperty("--bx", Math.cos(ang)*dist+"px");
    el.style.setProperty("--by", Math.sin(ang)*dist+"px");
    el.style.setProperty("--br", rand(-360,360).toFixed(0)+"deg");
    el.style.setProperty("--bd", rand(1,1.7).toFixed(2)+"s");
    fx.appendChild(el);
    fxRemove(el,2200);
  }
}

btnYes.addEventListener("click", function(){ accept(); });
function accept(){
  if(accepted) return;
  accepted = true;
  /* 记录开始时间 */
  var start = getStart() || Date.now();
  saveStart(start);
  renderLetter();

  /* 弹窗退场 + 全屏爱心爆发 */
  overlay.classList.remove("show");
  overlay.setAttribute("aria-hidden","true");
  document.body.classList.remove("lock");
  heartBurst();

  /* 稍候，正文缓缓浮现 */
  setTimeout(function(){ letter.classList.add("visible"); window.scrollTo(0,0); }, 700);
  setTimeout(function(){ startTyping(); }, 2300);

  /* 计时器立刻开始跳动（显示时随打字结束淡入） */
  startClock(start);
}

/* —— 生成正文段落 DOM —— */
var typedEls = []; // 每段的“已打字”span 与光标
function renderLetter(){
  var box = $("letterBody");
  box.innerHTML = "";
  for(var i=0;i<LETTER.length;i++){
    var item = LETTER[i];
    var p = document.createElement("p");
    if(typeof item === "object" && item.sign){ p.className = "sign"; }
    var text = typeof item === "string" ? item : item.sign;
    var typed = document.createElement("span");
    typed.className = "typed";
    var caret = document.createElement("span");
    caret.className = "caret";
    caret.style.display = "none";
    p.appendChild(typed); p.appendChild(caret);
    box.appendChild(p);
    typedEls.push({text:text, typed:typed, caret:caret});
  }
}

/* —— 打字机：逐字逐段，带停顿 —— */
var typeTimer = null;
var typing = false;
function startTyping(){
  typing = true;
  tip.style.opacity = 1;
  setTimeout(function(){ tip.style.opacity = 0; }, 6000);
  typeLine(0);
}
function schedule(fn,ms){ if(typing) typeTimer = setTimeout(fn, ms); }
function typeLine(idx){
  if(!typing) return;
  if(idx >= typedEls.length){ finishTyping(); return; }
  var seg = typedEls[idx];
  seg.caret.style.display = "inline-block";
  /* 每段开始前，把当前段滚进视野 */
  try{ seg.caret.scrollIntoView({block:"nearest",behavior:"smooth"}); }catch(err){ seg.caret.scrollIntoView(); }

  var pos = 0;
  function tick(){
    if(!typing) return;
    pos++;
    seg.typed.textContent = seg.text.slice(0,pos);
    if(pos % 8 === 0){ /* 不时保证光标可见 */
      try{ seg.caret.scrollIntoView({block:"nearest"}); }catch(err){}
    }
    if(pos >= seg.text.length){
      schedule(function(){ typeLine(idx+1); }, CONFIG.pauseAfterParaMs);
    } else {
      var ms = CONFIG.typingBaseMs + Math.random()*CONFIG.typingJitterMs;
      schedule(tick, ms);
    }
  }
  tick();
}
/* 全部打完：光标告别，卡片缓缓出现 */
function finishTyping(){
  typing = false;
  if(typeTimer){ clearTimeout(typeTimer); typeTimer = null; }
  for(var i=0;i<typedEls.length;i++){
    typedEls[i].caret.style.transition = "opacity .6s";
    typedEls[i].caret.style.opacity = "0";
  }
  setTimeout(function(){ loveCard.classList.add("show"); }, 900);
  /* 卡片出现后滚到最底部看彩蛋 */
  setTimeout(function(){ try{ loveCard.scrollIntoView({behavior:"smooth",block:"center"}); }catch(err){} }, 1600);
}
/* 点击正文：跳过打字，直接完成 */
letter.addEventListener("click", function(){
  if(!typing && !accepted) return;
  if(!typing) return; /* 已经完成就不再触发 */
  typing = false;
  if(typeTimer){ clearTimeout(typeTimer); typeTimer = null; }
  for(var i=0;i<typedEls.length;i++){
    typedEls[i].typed.textContent = typedEls[i].text;
    typedEls[i].caret.style.display = "none";
  }
  finishTyping();
});

/* ============================================================
   ⏱️ 时光彩蛋计时器：从「我愿意」那刻起算
   ============================================================ */
var clockTimer = null;
function startClock(start){
  var daysEl = $("days"), clockEl = $("clock");
  function tickOnce(){
    var diff = Math.max(0, Date.now() - start);
    var days = Math.floor(diff/86400000) + 1;
    var rest = diff % 86400000;
    var h = Math.floor(rest/3600000);
    var m = Math.floor(rest%3600000/60000);
    var s = Math.floor(rest%60000/1000);
    daysEl.textContent = days;
    clockEl.textContent = pad2(h)+":"+pad2(m)+":"+pad2(s);
  }
  tickOnce();
  clockTimer = setInterval(tickOnce, 1000);
}

/* 窗口变化时布局自适应；仅兜底：缩小窗口时把逃跑的按钮拉回屏幕内 */
window.addEventListener("resize", function(){
  if(btnNo.style.transform && btnNo.style.transform !== "none"){
    var r = btnNo.getBoundingClientRect();
    if(r.left < 0 || r.right > window.innerWidth || r.top < 0 || r.bottom > window.innerHeight){
      btnNo.style.transform = "none";
    }
  }
});
})();
</script>
</body>
